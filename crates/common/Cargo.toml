[package]
name = "agentgrid-common"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
# Issue #78: serde_yaml 0.9 is deprecated and pulls unmaintained
# unsafe-libyaml (RUSTSEC-2024-0449). serde-saphyr is pure Rust
# (#![forbid(unsafe)]), actively maintained, and keeps YAML 1.1 boolean
# compatibility for bool fields — the only YAML consumer in the workspace
# is workflow-manifest deserialization (no serialization needed, but the
# default features are kept: trimming them saves nothing measurable and
# non-default feature combos are less tested upstream).
serde-saphyr = "2"
sha2.workspace = true
uuid.workspace = true
chrono.workspace = true
thiserror.workspace = true
# Sealed adapter-env secrets (ADR 0028): the CP seals to a node's public key,
# the node opens with its private key.
x25519-dalek.workspace = true
ring.workspace = true
base64.workspace = true

[dev-dependencies]
proptest = "1.4"
