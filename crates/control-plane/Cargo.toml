[package]
name = "agentgrid-control-plane"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "agentgrid-control-plane"
path = "src/main.rs"

[lib]
name = "agentgrid_control_plane"
path = "src/lib.rs"

[dependencies]
axum.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
chrono.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
anyhow.workspace = true
sha2.workspace = true
async-stream.workspace = true
futures-core.workspace = true
futures-util.workspace = true
argon2.workspace = true
password-hash.workspace = true
jsonwebtoken.workspace = true
rand.workspace = true
agentgrid-common.workspace = true
agentgrid-skills.workspace = true
thiserror.workspace = true

sqlx = { version = "0.8", features = ["sqlite", "runtime-tokio", "migrate"] }
libsqlite3-sys = { version = "0.30", features = ["bundled"] }
libc = "0.2"
# Plan 1.2 (#22a): notify webhook fire-and-forget POST.
reqwest.workspace = true

# TLS termination (rustls, no system OpenSSL) — opt-in via AGENTGRID_TLS_CERT/_KEY.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "logging", "tls12"] }
tokio-rustls = "0.26"
rustls-pemfile = "2"

# OpenTelemetry (optional feature)
opentelemetry = { version = "0.27", optional = true }
opentelemetry_sdk = { version = "0.27", optional = true }
opentelemetry-prometheus = { version = "0.27", optional = true }
prometheus = { version = "0.13", optional = true }

# Static file serving (tower-http ServeDir)
tower-http = { version = "0.6", features = ["fs", "compression-br"] }
tower.workspace = true
http-body-util = "0.1"

[features]
default = []
opentelemetry = ["dep:opentelemetry", "dep:opentelemetry_sdk", "dep:opentelemetry-prometheus", "dep:prometheus"]

[dev-dependencies]
tower.workspace = true
serde_json.workspace = true
futures-util.workspace = true
reqwest.workspace = true
# Plan 0.3 2.2: WS test client (plaintext in-process tests).
tokio-tungstenite = "0.24"
