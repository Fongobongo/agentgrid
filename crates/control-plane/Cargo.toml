[package]
name = "agentgrid-control-plane"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "agentgrid-control-plane"
path = "src/main.rs"

[lib]
name = "agentgrid_control_plane"
path = "src/lib.rs"

[dependencies]
axum.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
chrono.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
anyhow.workspace = true
sha2.workspace = true
hmac.workspace = true
hex.workspace = true
async-stream.workspace = true
futures-core.workspace = true
futures-util.workspace = true
argon2.workspace = true
password-hash.workspace = true
jsonwebtoken.workspace = true
rand.workspace = true
agentgrid-common.workspace = true
agentgrid-skills.workspace = true
agentgrid-provision.workspace = true
thiserror.workspace = true

sqlx = { version = "0.9", features = ["sqlite", "runtime-tokio", "migrate"] }
libsqlite3-sys = { version = "0.37", features = ["bundled"] }
libc = "0.2"
rust-embed = { version = "8", features = ["mime-guess"] }
# Plan 1.2 (#22a): notify webhook fire-and-forget POST.
reqwest.workspace = true

# TLS termination (rustls, no system OpenSSL) — opt-in via AGENTGRID_TLS_CERT/_KEY.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "logging", "tls12"] }
tokio-rustls = "0.26"

# OpenTelemetry (optional feature)
opentelemetry = { version = "0.33", optional = true }
opentelemetry_sdk = { version = "0.33", optional = true }
opentelemetry-prometheus = { version = "0.33", optional = true }
prometheus = { version = "0.14", optional = true }
# OTLP trace export (ADR 0025 / 6b). http-proto + the blocking reqwest client:
# the batch processor exports from its own thread, which is not inside the tokio
# runtime, so an async client there would need a runtime it does not have.
# reqwest is already in the graph, so no tonic and no extra TLS stack.
opentelemetry-otlp = { version = "0.33", optional = true, default-features = false, features = ["http-proto", "reqwest-blocking-client"] }
tracing-opentelemetry = { version = "0.34", optional = true }

# Static file serving (tower-http ServeDir)
tower-http = { version = "0.7", features = ["fs", "compression-br"] }
tower.workspace = true
http-body-util = "0.1"
# Plan 6.7: stream artifact files (Range-aware) without reading them into RAM.
tokio-util = { version = "0.7", features = ["io"] }
async-compression = { version = "0.4.47", default-features = false, features = ["tokio", "zstd"] }
zstd = "0.14"

[features]
default = []
opentelemetry = [
    "dep:opentelemetry",
    "dep:opentelemetry_sdk",
    "dep:opentelemetry-prometheus",
    "dep:prometheus",
    "dep:opentelemetry-otlp",
    "dep:tracing-opentelemetry",
]
# Incremental SQLite changeset replication (RPO async/sync). Off by default so
# single-mode and musl builds keep the current dependency graph.
ha-incremental = []

[dev-dependencies]
tower.workspace = true
serde_json.workspace = true
futures-util.workspace = true
reqwest.workspace = true
# Contract test parses docs/openapi.yaml for real (a YAML syntax error or an
# unresolvable $ref must fail CI, not sail through a line scanner). Same crate
# the workspace already uses for workflow manifests.
serde-saphyr = "2"
# Plan 0.3 2.2: WS test client (plaintext in-process tests).
tokio-tungstenite = "0.30"
