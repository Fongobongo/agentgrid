[package]
name = "agentgrid-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
agentgrid-common = { path = "../crates/common" }
serde_json = "1"

[[bin]]
name = "policy_verdict_json"
path = "fuzz_targets/policy_verdict_json.rs"
test = false
doc = false
bench = false

[[bin]]
name = "workflow_template_yaml"
path = "fuzz_targets/workflow_template_yaml.rs"
test = false
doc = false
bench = false

[[bin]]
name = "handoff_package_json"
path = "fuzz_targets/handoff_package_json.rs"
test = false
doc = false
bench = false
