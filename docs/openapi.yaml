openapi: 3.0.3
info:
  title: AgentGrid Control Plane API
  version: 0.1.0
  description: |
    Public REST API of the AgentGrid control plane (`/v1` prefix). All
    node-facing routes (`/v1/node/*`) require node credentials; user-facing
    routes require a JWT obtained from `/v1/auth/setup` (first user) or
    `/v1/auth/login`. WebSocket is **not** part of the MVP — event streaming
    uses SSE at `/v1/tasks/{id}/events/stream`.

    This document is a generated summary of the public surface; see
    `crates/control-plane/src/lib.rs` for the authoritative route table.

    ## Error envelope (hardening P2 item 19)

    Handlers that return structured errors use a single machine-readable body:

    ```json
    {
      "error": {
        "code": "invalid_state_transition",
        "message": "attempt cannot transition from its current state",
        "request_id": "<uuid>"
      }
    }
    ```

    Stable codes: `invalid_state_transition` (409), `artifact_hash_mismatch`
    (422), `batch_too_large` (413), `rate_limited` (429), `not_found` (404),
    `unauthorized` (401), `forbidden` (403), `internal_error` (500),
    `service_unavailable` (503). Every response carries an `X-Request-Id`
    header (echoed/used for log correlation); the body `request_id` matches a
    freshly minted id for clients that only read the body.

paths:
  /v1/auth/setup:
    post:
      summary: Create the first admin user (one-time)
      description: Fails with 409 once a user exists. Returns a JWT on success.
  /v1/auth/login:
    post:
      summary: Exchange credentials for a JWT
  /v1/auth/logout:
    post:
      summary: Invalidate the current JWT
  /v1/admin/backup:
    post:
      summary: Snapshot the SQLite DB (VACUUM INTO) to a downloadable artifact
  /v1/admin/storage-gc:
    post:
      summary: Reconcile the artifact tree against metadata (orphan GC)
      description: |
        Body `{ "dry_run": bool }`. Reports `orphan_files`, `orphan_bytes`,
        `metadata_without_file` and `free_mb`. With `dry_run: false` orphan
        files are unlinked and dangling metadata rows pruned. Audited as
        `storage.gc`.
  /v1/tasks:
    get:
      summary: List tasks
      description: |
        Optional filters `status` / `repository` / `node_id` (exact match).
        Keyset pagination: pass `after_created_at` + `after_id` (the last
        row's values) to fetch the next page; `limit` caps the page (server
        ceiling 1000). Order is stable `(created_at, id)`.
      parameters:
        - name: status
          in: query
          schema: { type: string }
        - name: repository
          in: query
          schema: { type: string }
        - name: node_id
          in: query
          schema: { type: string }
        - name: after_created_at
          in: query
          schema: { type: string }
        - name: after_id
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer }
    post:
      summary: Create a task
  /v1/tasks/{id}:
    get:
      summary: Fetch a task by id
      description: |
        Task view includes `security_profile` — the security profile of the
        latest attempt (from `attempts.provenance.security_profile`), so
        operators can see the policy the agent ran under.
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
  /v1/tasks/{id}/cancel:
    post:
      summary: Request cancellation of a running task
  /v1/tasks/{id}/retry:
    post:
      summary: Re-queue a failed/cancelled task
  /v1/tasks/{id}/events:
    get:
      summary: List task events (polling)
      description: |
        Ordered by the global `ingest_id` cursor (migration 0037) so events
        from different attempts render in true time order after a retry.
        `after_ingest` resumes after that global cursor; legacy `after_sequence`
        (per-attempt) is still honoured. `limit` caps the page (default 1000).
      parameters:
        - name: after_ingest
          in: query
          required: false
          schema: { type: integer }
        - name: after_sequence
          in: query
          required: false
          schema: { type: integer }
        - name: limit
          in: query
          required: false
          schema: { type: integer }
  /v1/tasks/{id}/events/stream:
    get:
      summary: SSE event stream (Last-Event-ID resume supported)
      description: |
        The SSE `id:` field carries the global `ingest_id`; a reconnect sends it
        back as `Last-Event-ID` and resumes exactly where it stopped, across
        attempts.
  /v1/tasks/{id}/approvals:
    get:
      summary: List pending approvals for a task
  /v1/tasks/{id}/eligibility:
    get:
      summary: Show scheduler eligibility reasoning for a task
  /v1/tasks/{id}/artifacts/{name}:
    get:
      summary: Download a named artifact by content
  /v1/nodes:
    get:
      summary: List registered nodes
      description: |
        Each node carries `unsafe_active` (unsafe unattended bypass active) and
        `permission_interception` (`structured` | `wrapper` | `none`) so
        operators can spot fully-unrestricted nodes. Also `outbox_bytes` and
        `artifact_spool_bytes` (hardening P2 item 35): local storage pressure —
        a node whose spool grows is backing up and not draining.
  /v1/nodes/{id}:
    get:
      summary: Fetch a node by id
  /v1/nodes/{id}/drain:
    post:
      summary: Drain / undrain a node for maintenance
      description: |
        `?drain=true` (default) stops NEW task assignments while in-flight
        attempts finish and the heartbeat stays online; `?drain=false`
        re-enables scheduling. Audited as `node.drain` / `node.undrain`.
        (hardening P2 item 37)
  /v1/nodes/enrollment-token:
    post:
      summary: Mint a one-time node enrollment token (admin)
  /v1/node/enroll:
    post:
      summary: Enroll a new node with a one-time token (node credentials)
  /v1/node/heartbeat:
    post:
      summary: Publish node status/load/capabilities (node credentials)
  /v1/node/poll:
    post:
      summary: Long-poll a node for an assignment (node credentials)
  /v1/node/attempts/{id}/ack:
    post:
      summary: Acknowledge an assignment started (node credentials)
  /v1/node/attempts/{id}/begin_validate:
    post:
      summary: Signal the post-agent validation command has started (node credentials)
      description: |
        Moves the attempt (and task) `running → validating` (CAS). Idempotent:
        a retried signal on an already-validating/terminal attempt returns 200
        without error; a stale fencing token yields 409.
  /v1/node/attempts/{id}/events:
    post:
      summary: Ingest a batch of adapter events (node credentials)
  /v1/node/attempts/{id}/complete:
    post:
      summary: Report a terminal completion (node credentials)
      description: |
        Idempotent on terminal attempts — a late/stale completion is
        rejected, audited as `complete.rejected_terminal` (with the source
        attempt status), and acked without corrupting the task status.
  /v1/node/attempts/{id}/cancel:
    get:
      summary: Poll whether cancellation was requested (node credentials)
  /v1/node/attempts/{id}/session:
    post:
      summary: Open an agent session for an attempt (node credentials)
  /v1/node/attempts/{id}/artifacts:
    post:
      summary: Upload a JSON artifact (node credentials)
  /v1/node/attempts/{id}/artifacts/raw:
    post:
      summary: Upload a binary artifact (node credentials)
  /v1/node/tasks/{id}/artifacts/{name}:
    get:
      summary: Fetch an artifact for streaming (node credentials)
  /v1/repositories:
    get:
      summary: List repositories
    post:
      summary: Register a repository (admin)
  /v1/workflows:
    get:
      summary: List workflow definitions
    post:
      summary: Create a workflow definition
  /v1/workflows/{id}:
    get:
      summary: Fetch a workflow definition
  /v1/workflows/{id}/runs:
    post:
      summary: Start a workflow run from a definition
  /v1/workflows/{id}/schedules:
    get:
      summary: List schedules for a workflow
    post:
      summary: Create a schedule for a workflow
  /v1/workflows/{id}/schedules/{sid}:
    delete:
      summary: Delete a schedule
  /v1/workflow-runs:
    get:
      summary: List workflow runs
  /v1/workflow-runs/{id}:
    get:
      summary: Fetch a workflow run
  /v1/workflow-runs/{id}/approve-plan:
    post:
      summary: Approve an architect plan (PlanReady -> expand)
  /v1/workflow-runs/{id}/cancel:
    post:
      summary: Cancel a workflow run
  /v1/workflow-runs/{id}/plan:
    get:
      summary: Fetch the emitted plan (PlanReady)
  /v1/workflow-runs/{id}/projection:
    get:
      summary: Fetch the run projection (roles/nodes/verdicts)
  /v1/workflow-runs/{id}/tick:
    post:
      summary: Advance the run one scheduler tick (admin/debug)
  /v1/approvals:
    get:
      summary: List pending approvals
  /v1/approvals/{id}/allow:
    post:
      summary: Allow a pending approval
  /v1/approvals/{id}/deny:
    post:
      summary: Deny a pending approval
  /v1/approvals/{id}:
    get:
      summary: Fetch an approval
  /v1/conversations:
    get:
      summary: List conversations
  /v1/conversations/{id}:
    get:
      summary: Fetch a conversation
  /v1/conversations/{id}/messages:
    get:
      summary: List messages in a conversation
  /v1/profiles:
    get:
      summary: List agent profiles
    post:
      summary: Create/revise an agent profile
  /v1/profiles/{id}:
    get:
      summary: Fetch a profile
  /v1/profiles/{id}/activate:
    post:
      summary: Mark a profile revision active
  /v1/mcp-servers:
    get:
      summary: List MCP server registry entries
    post:
      summary: Create an MCP server registry entry
  /v1/mcp-servers/{id}:
    get:
      summary: Fetch an MCP server registry entry
  /v1/policy/evaluate:
    post:
      summary: Evaluate an autonomy policy decision
  /v1/skills:
    get:
      summary: List discovered skills (operator-trusted)
  /v1/skills/{name}/trust:
    post:
      summary: Trust a skill
  /v1/skills/{name}/untrust:
    post:
      summary: Untrust a skill (fail-closed)
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    nodeCred:
      type: http
      scheme: bearer
      description: Node credential issued at enrollment.
