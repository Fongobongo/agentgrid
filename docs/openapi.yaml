openapi: 3.1.0
info:
  title: AgentGrid Control Plane API
  version: 0.8.1
  license:
    name: MIT
    identifier: MIT
  description: |
    Public REST API of the AgentGrid control plane (`/v1` prefix). All
    node-facing routes (`/v1/node/*`) require node credentials; user-facing
    routes require a JWT obtained from `/v1/auth/setup` (first user) or
    `/v1/auth/login`. Event streaming is SSE at
    `/v1/tasks/{id}/events/stream`; nodes additionally have a WebSocket
    transport at `/v1/node/ws` (see `docs/node-ws-protocol.md`).

    This document is a generated summary of the public surface; see
    `crates/control-plane/src/lib.rs` for the authoritative route table.

    ## Error envelope (hardening P2 item 19)

    Handlers that return structured errors use a single machine-readable body:

    ```json
    {
      "error": {
        "code": "invalid_state_transition",
        "message": "attempt cannot transition from its current state",
        "request_id": "<uuid>"
      }
    }
    ```

    Stable codes: `invalid_state_transition` (409), `artifact_hash_mismatch`
    (422), `batch_too_large` (413), `rate_limited` (429), `not_found` (404),
    `unauthorized` (401), `forbidden` (403), `internal_error` (500),
    `service_unavailable` (503). Every response carries an `X-Request-Id`
    header (echoed/used for log correlation); the body `request_id` matches a
    freshly minted id for clients that only read the body.

servers:
  - url: /
    description: Same origin the control plane is served from.
security:
  - userAuth: []
paths:
  /health/live:
    get:
      summary: Liveness probe (always 200)
      security: []
  /health/ready:
    get:
      summary: Readiness probe (DB + disk-writable check)
      security: []
  /metrics:
    get:
      summary: Prometheus metrics endpoint
      security: []
  /v1/version:
    get:
      summary: Build + contract versions (public)
      description: |
        Plan 6.12 / 2.6. Returns the control-plane crate version plus the
        node-facing contract versions: `node_protocol` (enroll/heartbeat/poll
        major; mismatch → node degraded), `capabilities_schema` (heartbeat
        capabilities array), `supported_event_versions` (event ingest
        contract). Used by `ag doctor` and the release smoke test.
      security: []
  /v1/auth/setup:
    post:
      summary: Create the first admin user (one-time)
      description: Fails with 409 once a user exists. Returns a JWT on success.
      security: []
  /v1/auth/login:
    post:
      summary: Exchange credentials for a JWT
      security: []
  /v1/auth/logout:
    post:
      summary: Invalidate the current JWT
      security: []
  /v1/users:
    get:
      summary: List users (username + role)
      description: Plan 5.2 RBAC. Admin view of local accounts.
    post:
      summary: Create a user (admin only)
      description: |
        Body `{ "username", "password", "role"? }` where role is `admin` or
        `operator` (defaults to `operator`). Operators may only view (GET) and
        approve/deny; all other mutating calls return 403. Non-admin callers
        receive 403 from the RBAC middleware.
  /v1/admin/backup:
    post:
      summary: Snapshot the SQLite DB (VACUUM INTO) to a downloadable artifact
  /v1/admin/storage-gc:
    post:
      summary: Reconcile the artifact tree against metadata (orphan GC)
      description: |
        Body `{ "dry_run": bool }`. Reports `orphan_files`, `orphan_bytes`,
        `metadata_without_file` and `free_mb`. With `dry_run: false` orphan
        files are unlinked and dangling metadata rows pruned. Audited as
        `storage.gc`.
  /v1/tasks:
    get:
      summary: List tasks
      description: |
        Optional filters `status` / `repository` / `node_id` (exact match).
        Keyset pagination: pass `after_created_at` + `after_id` (the last
        row's values) to fetch the next page; `limit` caps the page (server
        ceiling 1000). Order is stable `(created_at, id)`.
      parameters:
        - name: status
          in: query
          schema: { type: string }
        - name: repository
          in: query
          schema: { type: string }
        - name: node_id
          in: query
          schema: { type: string }
        - name: after_created_at
          in: query
          schema: { type: string }
        - name: after_id
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer }
    post:
      summary: Create a task
      description: |
        Competitor-gap feature (GitHub write-back): set `github_push: true`
        with `github_repo` (`owner/name`), optional `github_issue` (number)
        and `github_base_ref` so a successful attempt pushes its agent
        branch, opens a PR and comments on the issue. Requires
        `AGENTGRID_GITHUB_TOKEN` on the node; best-effort — a failure only
        emits a log event.
  /v1/tasks/{id}:
    get:
      summary: Fetch a task by id
      description: |
        Task view includes `security_profile` — the security profile of the
        latest attempt (from `attempts.provenance.security_profile`), so
        operators can see the policy the agent ran under.
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
  /v1/tasks/{id}/cancel:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    post:
      summary: Request cancellation of a running task
  /v1/tasks/{id}/retry:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    post:
      summary: Re-queue a failed/cancelled task
  /v1/search:
    get:
      summary: Full-text search over tasks (FTS5)
      description: |
        Plan 1.3 (#6): matches the prompt/repository via the FTS5 mirror,
        ranked by bm25, capped at 50 rows. `q` is tokenized; punctuation is
        quoted so it does not break the query.
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string }
  /v1/search/events:
    get:
      summary: Full-text search over past task events (FTS5)
      description: |
        Competitor-gap feature: matches agent event payloads via the
        contentless `events_fts` mirror, ranked by bm25. The hit carries the
        owning task id, attempt id, sequence, stored event type and raw
        payload (joined back through `task_events`). `limit` caps the page
        (default 100, server ceiling 1000).
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 1000 }
  /v1/attempts/{id}:
    get:
      summary: Fetch a single attempt (prompt included)
      description: |
        Plan 1.3 (#13): attempt detail used by `ag resume` to inherit the
        owning task's prompt/context without a second lookup.
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
  /v1/attempts/{id}/annotations:
    get:
      summary: List inline annotations on an attempt's diff/plan
      description: 'Plan 1.6 (#3b): reviewer comments pinned to file/line.'
    post:
      summary: Leave an inline annotation
      description: |
        Plan 1.6 (#3b): create a comment pinned to a file (and optional
        1-based line range) on an attempt's diff/plan. Stored in SQLite as
        `patch_annotations`; folded into a rework task prompt by
        `POST /v1/attempts/{id}/rework`.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [file, comment]
              properties:
                file: { type: string }
                line_start: { type: integer }
                line_end: { type: integer }
                comment: { type: string }
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
  /v1/attempts/{id}/rework:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    post:
      summary: Send an attempt for rework with the annotations as feedback
      description: |
        Plan 1.6 (#3b): creates a NEW task whose prompt is the original
        prompt plus an `[ANNOTATIONS]` block built from the attempt's inline
        annotations. Returns the new task id.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '201':
          description: Rework task created
          content:
            application/json:
              schema:
                type: object
                properties:
                  task_id: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /v1/tasks/{id}/review-approval:
    get:
      summary: Fetch the pending patch-review approval for a task
      description: |
        Plan 1.1: a successful attempt creates a pending `task_patch_review`
        approval. Returns it (or `null`) so the UI shows Accept / Reject /
        Request rework.
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
  /v1/tasks/{id}/tags:
    get:
      summary: List a task's tags
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
  /v1/tasks/{id}/tags/{tag}:
    post:
      summary: Add a tag to a task (idempotent)
    delete:
      summary: Remove a tag from a task
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
      - name: tag
        in: path
        required: true
        schema: { type: string }
  /v1/webhooks/github/issues:
    post:
      summary: GitHub issue webhook → create a task
      description: |
        Plan 1.4 (#2a): verifies the `X-Hub-Signature-256` HMAC-SHA256
        signature against `AGENTGRID_GITHUB_WEBHOOK_SECRET`, then creates a
        task from the issue body when the issue carries the `agent` label.
        Disabled (404) when the secret is unset.
      security: []
  /v1/webhooks/github/check_run:
    post:
      summary: GitHub check_run webhook → spawn a CI-fix task
      description: |
        Plan 1.10 (#1): on `action=completed` + `conclusion in {failure,
        cancelled}` spawns an autonomous CI-fix task — the agent reads the
        failed check's log and attempts the minimal fix. Success/skipped
        conclusions are acked silently. HMAC verified via
        `AGENTGRID_GITHUB_WEBHOOK_SECRET`; disabled (404) when unset.
      security: []
  /v1/webhooks/github/pull_request:
    post:
      summary: GitHub pull_request webhook → spawn a conflict-resolve task
      description: |
        Plan 1.10 (#1): on `action in {opened, synchronize, reopened}` with
        `pull_request.mergeable_state == "conflicting"` spawns an autonomous
        merge-conflict resolve task — the agent rebases and resolves
        conflicts to make the PR mergeable. Clean/blocked states are acked
        silently. HMAC verified via `AGENTGRID_GITHUB_WEBHOOK_SECRET`;
        disabled (404) when unset.
      security: []
  /v1/task-groups/{id}/context:
    get:
      summary: List shared-context notes for a task group
      description: |
        Plan 1.12 (#7): all notes written by attempts of a logical task
        group (flat key→value, ordered by key). Empty array when none.
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
  /v1/agents:
    post:
      summary: Register an org agent (plan 2.1 #18)
      description: |
        Long-lived agent identity with a role, prompt template, attached
        skills, a display budget (USD) and an optional hard task stop
        (max_tasks). Heartbeat interval (seconds) enables scheduled task
        spawning. 400 on invalid name/role; 409 on duplicate name.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
                role: { type: string, default: worker }
                prompt: { type: string, default: "" }
                skills: { type: array, items: { type: string } }
                budget_usd: { type: number, default: 0 }
                max_tasks: { type: [integer, "null"] }
                heartbeat_interval_secs: { type: [integer, "null"] }
      responses:
        "201":
          description: Agent created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Agent" }
        '401': { $ref: '#/components/responses/Unauthorized' }
    get:
      summary: List org agents with current task spend
      responses:
        "200":
          description: Agents
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Agent" }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /v1/agents/{id}/actions:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    get:
      summary: An agent's immutable action trail (plan 2.1 #18)
      description: Newest first, capped at 500 rows.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Trail rows
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AgentAction" }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /v1/agents/{id}/tasks:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    post:
      summary: Create a task attributed to an agent (plan 2.1 #18)
      description: |
        Counts against the agent's max_tasks budget; 409 when exhausted or
        the agent is unknown. Body is a normal create-task request.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateTaskRequest" }
      responses:
        "201":
          description: Task created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TaskView" }
        "409":
          description: Budget exhausted or unknown agent
  /v1/task-groups/{id}/context/{key}:
    get:
      summary: Read one shared-context note's value
      description: |
        Plan 1.12 (#7): returns the raw value string; 404 when the key is
        not set for the group.
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
      - name: key
        in: path
        required: true
        schema: { type: string }
    put:
      summary: Set (upsert) a shared-context note
      description: |
        Plan 1.12 (#7): overwrites the value for (group, key) and bumps
        updated_at. 204 on success. Keys must be path-safe alphanumerics /
        `-` / `_` / `.`; group ids validated as opaque ids.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [value]
              properties:
                value: { type: string }
    delete:
      summary: Delete a shared-context note (no-op when absent)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: key
          in: path
          required: true
          schema: { type: string }
  /v1/tasks/{id}/events:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    get:
      summary: List task events (polling)
      description: |
        Ordered by the global `ingest_id` cursor (migration 0037) so events
        from different attempts render in true time order after a retry.
        `after_ingest` resumes after that global cursor; legacy `after_sequence`
        (per-attempt) is still honoured. `limit` caps the page (default 1000).
      parameters:
        - name: after_ingest
          in: query
          required: false
          schema: { type: integer }
        - name: after_sequence
          in: query
          required: false
          schema: { type: integer }
        - name: limit
          in: query
          required: false
          schema: { type: integer }
  /v1/tasks/{id}/events/stream:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    get:
      summary: SSE event stream (Last-Event-ID resume supported)
      description: |
        The SSE `id:` field carries the global `ingest_id`; a reconnect sends it
        back as `Last-Event-ID` and resumes exactly where it stopped, across
        attempts.
  /v1/stream:
    get:
      summary: SSE change-notification stream for UI lists
      description: |
        Emits `hello` on connect and `change` whenever the status fingerprint
        (task/node/workflow-run counts by status) moves. Clients refetch their
        lists on those events; an idle client receives only 15 s keep-alives.
  /v1/tasks/{id}/approvals:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    get:
      summary: List pending approvals for a task
  /v1/tasks/{id}/eligibility:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    get:
      summary: Show scheduler eligibility reasoning for a task
  /v1/tasks/{id}/artifacts:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    get:
      summary: List a task's artifacts (latest attempt) with metadata
      description: |
        Plan 1.11 (#8): names, sizes, media types and sha256 of the task's
        artifacts on its latest attempt. Empty array when the task has no
        attempts or none uploaded artifacts.
  /v1/tasks/{id}/artifacts/{name}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
      - name: name
        in: path
        required: true
        schema: { type: string }
    get:
      summary: Download a named artifact by content
  /v1/nodes:
    get:
      summary: List registered nodes
      description: |
        Each node carries `unsafe_active` (unsafe unattended bypass active) and
        `permission_interception` (`structured` | `wrapper` | `none`) so
        operators can spot fully-unrestricted nodes. Also `outbox_bytes` and
        `artifact_spool_bytes` (hardening P2 item 35): local storage pressure —
        a node whose spool grows is backing up and not draining.

        `adapter_env_delivery` (ADR 0029) is `{plain, gateway, exchange}`: how
        many of the node's **local** `AGENTGRID_ADAPTER_ENV` entries are handed
        to the agent as plain values — readable inside the sandbox,
        threat-model T13a — how many are replaced by per-attempt capabilities
        minted by the credential gateway, and how many are replaced by a **real,
        short-lived, provider-issued** token. The last two are counted apart on
        purpose: a capability is worthless outside the gateway, while an
        exchanged token works from anywhere until the provider expires it, so
        adding them together would report the safer mode's number for the less
        safe one. Counts only; names and values stay on the node.
        Absent means the node has never reported (older binary, or no heartbeat
        since upgrading), which is **not** the same claim as `plain: 0`. A node
        that predates exchange mode reports no `exchange` field at all.

        Reachability (ADR 0026 + ADR 0012): `relay_hops` is how many forwarders
        the last heartbeat crossed before it arrived — `0` when none did — and
        `egress_proxy` says the node dials through its egress proxy pool. The
        two are sourced differently on purpose. `relay_hops` is **observed** by
        the control plane from the `x-agentgrid-relay-hops` header, which every
        relay and every `agentgrid-cp-edge` replaces with its own count, so a
        node cannot claim fewer hops than it used; `egress_proxy` is **claimed**
        by the node, because a forward proxy is invisible to the receiver. Both
        are `null` until a heartbeat carries them (no heartbeat since the
        columns existed).

        `relay_hops: 0` therefore means "no AgentGrid forwarder in the path".
        It does not rule out an L4 balancer or a generic HTTP proxy: those do
        not stamp, and at layer 4 there is nothing to stamp with.

        Every response also echoes the count it observed in
        `x-agentgrid-relay-hops`, always present (including `0`). That is what
        makes "did a relay actually carry this?" answerable from the client
        side: a caller that dialled a relay and got `0` is talking to the relay
        directly, and a caller that gets no header at all is talking to a
        control plane too old to echo, not through zero hops.

        `relay_url` is this node's announced relay endpoint — the address other
        hosts should dial to reach this control plane through it, from
        `AGENTGRID_RELAY_ADVERTISE` or a concrete listen address. **A claim**,
        like `egress_proxy` and unlike `relay_hops`: the control plane cannot
        verify an address whose entire purpose is to be reachable from hosts
        that cannot reach the control plane. `null` means the node is not a
        relay, or is one nobody can dial — a `0.0.0.0` listen with no
        `AGENTGRID_RELAY_ADVERTISE` announces nothing, because a guessed
        hostname would fail on the other machine, not on this one. It is what
        `POST /v1/nodes/join-command` names when a host cannot connect
        directly.

        `relay_listen` is where that relay **binds** (`AGENTGRID_RELAY_LISTEN`,
        e.g. `0.0.0.0:7900`), reported separately so the two ways of having no
        dialable address stay distinguishable: no `relay_listen` at all means
        "not a relay", while a `relay_listen` with a `null` `relay_url` means "a
        relay nobody can dial" — running, and useless until
        `AGENTGRID_RELAY_ADVERTISE` says where to reach it. Both are claims.

        The list is every enrolled node in every state — `offline`, `degraded`,
        `revoked` included. A node is flipped to `offline` after 30 s without a
        heartbeat. A host that was configured but never enrolled has no row
        here; `GET /v1/node-installs` is the record of those, and it is stored.
  /v1/cluster/status:
    get:
      summary: This replica's HA role, term and per-peer liveness
      description: |
        The same body as the peer RPC `GET /v1/ha/status`, for an operator. That
        route is behind the cluster token because a peer must not be
        impersonable by a user session — which also meant no panel could read
        it, leaving `ag cluster status` as the only view of a peer that stopped
        answering. Read-only.

        `peers` is the view from **this** replica. Configuration is the skeleton
        — a peer that has never answered is still listed, because unreachable
        and nonexistent are different problems — and observations fill it in
        from the exchanges the consensus protocol already makes (the leader's
        heartbeat fan-out, an inbound heartbeat, a vote request). Only the
        leader fans out to everyone, so on a standby most peers read `never`:
        that is the truth from there, not a gap.

        `state` is `up` (the last exchange succeeded), `stale` (one miss, or no
        contact for two election timeouts), `down` (repeated failures) or
        `never`. `applied_seq` is the peer's last reported replication position
        and survives failures — a peer that stopped answering is behind by at
        least that much. `peers` is empty in single mode.
      responses:
        '200':
          description: '`{node_id, role, term, epoch, leader_id, applied_seq, peers[]}`.'
        '401': { $ref: '#/components/responses/Unauthorized' }
  /v1/nodes/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    get:
      summary: Fetch a node by id
  /v1/opencode-profiles:
    get:
      summary: List opencode config profiles
      description: |
        Feature "opencode profiles" — named bundles of opencode settings
        (model, small_model, provider blocks, plugin npm refs, inline
        skills) stored server-side and pushed to nodes that are assigned
        the profile. Storage is opaque JSON validated against a small
        key allowlist; secrets stay out (env placeholders only).
  /v1/opencode-profiles/{name}:
    parameters:
      - name: name
        in: path
        required: true
        schema: { type: string }
    get:
      summary: Show one opencode profile
    put:
      summary: Create-or-replace an opencode profile by name
      description: |
        Recomputed hash is returned in the response; the CP multicasts
        `config_update` to every node currently subscribed to this profile
        so it applies immediately when connected. PUT is idempotent (the
        same config produces the same hash and no audit churn).
        Pass `?dry_run=true` to see the post-sanitisation body, the hash that
        would have been computed and the dropped unknown keys — without
        writing. Allowed keys are shape-checked (model a string, snapshot a
        bool, provider an object, plugin an array) so a typo on an
        allowed key fails the PUT loudly instead of silently shipping a
        broken config.
    delete:
      summary: Delete a profile (nodes keep their last-applied on-disk config)
  /v1/opencode-profiles/{name}/rollback:
    parameters:
      - name: name
        in: path
        required: true
        schema: { type: string }
    post:
      summary: "Swap the profile back N revisions"
      description: |
        Every PUT stores the pre-write body in `opencode_profile_revisions`
        (0068); rollback walks back N (query `?steps=N`, default 1, cap 32)
        and replaces the live row. The assigned nodes receive the new hash
        over the WS push channel immediately.
      security: [{ userAuth: [] }]
      parameters:
        - in: path
          name: name
          required: true
          schema: { type: string }
      responses:
        '200': { description: Rolled back. Body is the profile after the swap. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { description: Profile unknown or no previous revision exists. }
  /v1/opencode-profiles/{name}/assign-percent:
    parameters:
      - name: name
        in: path
        required: true
        schema: { type: string }
    post:
      summary: "A/B split the fleet between two profiles"
      description: |
        Moves the nodes currently on either arm (`{name}` and the body's
        `other`) so that `percent`% land on `{name}` and the rest on
        `other`. Deterministic (ordered by node id) so re-running with the
        same percent is stable; only nodes already on one of the two arms
        move, the rest of the fleet is left alone.
      security: [{ userAuth: [] }]
      parameters:
        - in: path
          name: name
          required: true
          schema: { type: string }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [other, percent]
              properties:
                other: { type: string, description: The other arm's profile id. }
                percent: { type: integer, minimum: 0, maximum: 100 }
      responses:
        '200': { description: Moved. Body reports the moved node ids and counts per arm. }
        '400': { description: "`other` equals `{name}`, or `percent` > 100." }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { description: Either profile unknown. }
  /v1/nodes/{id}/opencode-profile:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    post:
      summary: Assign or clear the profile applied by a node
      description: |
        Body `{ "profile_id": "..." }` assigns; `{ "profile_id": null }`
        clears. Pushes `config_update` to the node when it's connected so
        the change applies immediately.
  /v1/node/opencode-config/active:
    get:
      summary: "Node pulls its assigned opencode profile"
      tags: [opencode]
      security:
        - nodeAuth: []
      responses:
        '200':
          description: Active profile for the node (config + hash + profile_id), or 404.
        '401':
          description: Node auth required.
        '404':
          description: No opencode profile assigned to this node.
  /v1/node/opencode-config/audit:
    post:
      summary: "Node records an opencode-config apply event"
      tags: [opencode]
      security:
        - nodeAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [hash, trigger]
              properties:
                hash: { type: string }
                trigger: { type: string, enum: [ws_push, error_threshold, interval, startup] }
                profile_id: { type: [string, "null"] }
      responses:
        '204':
          description: Audit recorded.
        '400':
          description: Bad trigger vocabulary or hash shape.
        '401':
          description: Node auth required.
  /v1/nodes/{id}/opencode-audit:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    get:
      summary: Recent opencode-config apply events for this node
      description: |
        One row per apply (ws_push | error_threshold | interval | startup).
        Useful for the dashboard "who's on which profile" view.
  /v1/nodes/{id}/drain:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    post:
      summary: Drain / undrain a node for maintenance
      description: |
        `?drain=true` (default) stops NEW task assignments while in-flight
        attempts finish and the heartbeat stays online; `?drain=false`
        re-enables scheduling. Audited as `node.drain` / `node.undrain`.
        (hardening P2 item 37)
  /v1/nodes/{id}/accounts/usage:
    get:
      summary: Per-account usage for a node (provider failover metrics)
      description: |
        Plan 1.8 (#15): attempt counts and 429 rate-limits per credential
        env var, as reported by the node in its heartbeats. In-memory; empty
        list when the node never reported usage.
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
  /v1/nodes/enrollment-token:
    post:
      summary: Mint a one-time node enrollment token (admin)
      description: |
        The token is spent by `POST /v1/node/enroll`. The body is optional and
        advisory: `{host, name}` records an `issued` row in
        `GET /v1/node-installs`, which is how a host installed from an
        operator's laptop — where the install itself never reaches this control
        plane — stays visible. A body that does not parse is ignored rather than
        refused: the token still gets minted.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                host:
                  type: string
                  description: '`user@host` or `user@host:port`, as the installer sees it.'
                name:
                  type: string
                  description: Node name the install will use.
      responses:
        '200':
          description: '`{ token, expires_at }` — one use, 10 minutes.'
        '401':
          description: Not authenticated.
  /v1/nodes/{id}/rekey-token:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    post:
      summary: Mint a one-time re-key token bound to an existing node (admin)
      description: |
        The token is spent by `POST /v1/node/enroll` exactly like a plain one,
        but it does not create a node: it replaces the credential of the node it
        is bound to. The id, the task history and the X25519 key the node's
        adapter-env secrets are sealed to all survive, and a `revoked` node
        comes back online — so this is the recovery path for a leaked
        `credential.json`, where revoke + re-enroll would mint a new id and drop
        every sealed secret.

        Valid 30 minutes, single use, audited as `node.rekey`. `404` for an
        unknown node: a token nobody can spend would read as a successful
        re-key until the node never came back.

        The node spends it by starting once with `AGENTGRID_REKEY=1` and the
        token in `AGENTGRID_ENROLL_TOKEN`; it keeps the sealing key already in
        `credential.json`, so no adapter-env value has to be re-entered.
      responses:
        '200':
          description: '`{ token, expires_at }` — the same shape as the plain token.'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: No node with that id.
  /v1/provisioning:
    get:
      summary: Whether this control plane can install nodes over ssh
      description: |
        `enabled` mirrors `AGENTGRID_PROVISION_ENABLED`; `reason` is the
        operator-facing explanation the panel renders when it cannot offer the
        Install button (feature off, or no `agentgrid-node-daemon` next to the
        control plane). Read-only, so an operator (GET-only) may call it.
      responses:
        '200':
          description: Capability report (`enabled`, `node_binary`, `reason`).
        '401': { $ref: '#/components/responses/Unauthorized' }
  /v1/node-installs:
    get:
      summary: Recent node-install jobs, newest first
      description: |
        Every host this control plane has seen an install for. Stored in
        `node_installs`, so a restart no longer erases them — that list was the
        only evidence a host had been configured at all, since `nodes` is keyed
        by enrollment.

        `state` is `issued`, `running`, `succeeded` or `failed`. `issued` means
        an enrollment token was minted for the host and nothing has been heard
        since: the install ran somewhere else (`ag nodes install` from an
        operator's laptop, the install script) and never reported back. Such a
        row is closed to `succeeded` when a node with that name enrolls — the
        token was spent by a node that is now talking to us, which is the
        outcome the row was waiting for — and the closing step names the node
        it became. That close is applied to every matching `issued` row in the
        table, not only to the ones still inside this list's window. A row still
        at `running` after a restart is shown as `failed` with the reason — the
        process that was doing the work is gone — but the stored row keeps the
        raw state, because on an HA standby it belongs to the leader.

        Finished attempts are pruned after 30 days
        (`AGENTGRID_INSTALL_RETENTION_HOURS`, `0` = keep forever). `issued` and
        `running` rows are never pruned by age: they are open questions, and the
        open questions are the reason the table exists.
      responses:
        '200':
          description: Jobs with their steps and terminal state.
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      summary: Provision a remote host as a node over ssh (admin)
      description: |
        Off unless `AGENTGRID_PROVISION_ENABLED=1`: a control plane that can ssh
        into hosts is a different threat model from one that cannot.

        Mints a one-shot enrollment token, then runs the same provisioning as
        `ag nodes install` on a blocking thread — verify (or pin) the SSH host
        key, copy `agentgrid-node-daemon`, write a `0600` env file, start the
        daemon detached. Credentials (password, key path) are used for the
        length of the install and never stored, audited or logged.

        `ssh_cert` is an OpenSSH certificate for `ssh_key` (CA-signed and
        short-lived, the way a bastion hands out access): it is passed to both
        `ssh` and `scp` as `-o CertificateFile=<path>`, is read from the
        control plane's own filesystem, and is never copied to the node.
        It requires `ssh_key` and is mutually exclusive with `password` —
        a combination is a `400`, not a silent preference for one of them.

        Direct transport only: `server` must be an address the **node** can
        dial (this control plane, or a peer's relay) and defaults to
        `AGENTGRID_PUBLIC_URL`. Returns a job id; poll
        `GET /v1/node-installs/{id}` for the steps.

        Its own namespace on purpose: under `/v1/nodes/…` these paths collide
        with `/v1/nodes/{id}` and `/v1/nodes/{id}/opencode-profile`.
      responses:
        '202':
          description: Install started (`job_id`, `state`).
        '400':
          description: Invalid host or name, or no server URL.
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: Provisioning is disabled on this control plane. }
        '409': { description: No `agentgrid-node-daemon` (set `AGENTGRID_NODE_DIST`). }
        '503': { description: Could not mint an enrollment token. }
  /v1/node-installs/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    get:
      summary: Progress of one node-install job
      responses:
        '200':
          description: The job — state, steps, error, server_url.
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: No such job — or it was evicted from the ring.
    delete:
      summary: Forget one install record (admin)
      description: |
        Delete the trace of a host that was configured and will never arrive.
        `issued` rows are exempt from retention on purpose — they answer "was
        this host ever configured?" — so a decommissioned host's record has to
        be removed explicitly, and this is the way to do it.

        Not to be confused with `DELETE /v1/nodes/{id}`, which revokes a node
        that *did* enroll and keeps its history. This deletes the record of a
        host that never became a node.

        A `running` row is refused: the control plane is installing right now,
        that row is the only place it shows, and the install thread would
        rewrite it the moment it finished.
      responses:
        '204':
          description: Deleted, from the table and from the panel.
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: No such install record.
        '409':
          description: The install is running; let it finish (or fail), then forget it.
  /v1/nodes/join-command:
    post:
      summary: Mint a token and the exact line that joins a host to this control plane
      description: |
        The server-side half of the pull-based join. Returns a fresh single-use
        enrollment token (ten minutes) already substituted into the one shell
        line an operator pastes on the new host:

        ```sh
        curl -fsSL <server>/v1/node/join.sh | sudo bash -s -- --token <t>
        ```

        It is an endpoint rather than string formatting in the panel because
        `via` needs the fleet: only the control plane knows which nodes
        announced a dialable relay address, and that address is what the
        command has to name.

        `via` is a node **id or name** whose relay carries the join, for a host
        that cannot reach this control plane directly. `server` in the response
        is then the relay's URL, and the line carries `--server <relay>` as
        well. That flag looks redundant — the script fetched through the relay
        already defaults to its own server — but the default is
        `AGENTGRID_PUBLIC_URL` when an operator set one, and that address is
        exactly the one the new host cannot reach. A redundant flag is cheaper
        than an install that fails at the last step on a machine the operator
        cannot inspect.

        A refused `via` is never downgraded to a direct join. The operator
        asked for a relay *because* the direct path does not work, so a
        silently direct command is a command that fails later and elsewhere.

        The token is minted **after** the relay resolves, so a refusal cannot
        leave a token that is spent nowhere behind. `name` is required — it is
        what the daemon registers under, and an `issued` row is recorded in
        `node_installs` so a host that was configured and never arrived stays
        visible (see `GET /v1/node-installs`). `host` is display-only:
        nothing dials it, unlike `POST /v1/node-installs`, which needs ssh
        *to* the host and therefore cannot run from the host itself.

        `via` carries the relay's `status` and `last_heartbeat_at` as they were
        when the command was built. A **revoked** relay is refused outright (its
        credential is dead, so it cannot reach the control plane and cannot
        carry anyone else's join), but an **offline** one is only reported: it
        may be back before the line is pasted, and refusing would make this
        endpoint guess. The client is expected to warn — the command is minted
        for a host nobody can log into.

        `probe: true` appends `--probe` to the line: the host checks what it can
        reach before installing anything and stops if the check fails. It is
        asked for, never assumed — it costs a round trip and a bundle checksum
        on a path that often already works — and on a relayed join it is the
        only thing that tells a relay which forwards from a proxy which merely
        listens: the report's `CONTROL PLANE` line then reads `hops=1`.

        A static segment wins over `/v1/nodes/{id}` in axum's router, so this
        path is reachable even though the pattern also matches.
      responses:
        '200':
          description: '`{token, expires_at, command, server, via?}` — `via` is `{node_id, name, relay_url, status, last_heartbeat_at}` when the join goes through a relay.'
        '400':
          description: No `name` (an unparseable body is treated as empty and fails the same way).
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: '`via` names no node, by id or by name.'
        '409':
          description: |
            `via` names a node that cannot carry the join. Either it is
            **revoked** — a revoked credential cannot reach this control plane,
            so its relay is gone by definition — or it announces no dialable
            relay address. The refusal names the repair: `ag nodes rekey` for
            the first, and `AGENTGRID_RELAY_ADVERTISE` (if it already listens)
            or `AGENTGRID_RELAY_LISTEN` (if it does not) for the second.
        '503':
          description: Could not read the node list, or could not mint a token.
  /v1/node/skills-trust:
    get:
      summary: "Node-readable copy of the operator skill trust ledger"
      description: |
        The same rows `GET /v1/skills` returns, but behind node auth so a
        node daemon holding only its long-lived credential can read them.
        Used to compose the agent's "approved skills" block and to
        reconcile bundle-pinned skills against the operator trust verdicts.
      security: [{ nodeAuth: [] }]
      responses:
        '200':
          description: Skill trust rows (name, source, trusted, decided_by, updated_at).
        '401': { $ref: '#/components/responses/Unauthorized' }
        '503': { description: Store failure. }
  /v1/node/enroll:
    post:
      summary: Enroll a new node with a one-time token (node credentials)
      description: |
        The one route under `/v1/node/` that is **not** behind `nodeAuth`: the
        node has no credential yet, so it authenticates with the one-time
        enrollment token instead. `require_node_auth` exempts this path.
      security: []
  /v1/node/join.sh:
    get:
      summary: Shell script that joins a new host to this control plane
      description: |
        Served with this control plane's public URL substituted in, so the whole
        join is one line the operator copies out of the panel and pastes on the
        new host:

        ```sh
        curl -fsSL https://cp.example.com/v1/node/join.sh | sudo bash -s -- --token <t>
        ```

        The script fetches the daemon (and the adapters named on the command
        line) from `/v1/node/bundle`, verifies each against the bundle's
        SHA-256, then hands the staging directory to the installer served at
        `/v1/node/install.sh` — the same `deploy/install-node.sh` the release
        tarball ships, so the pull path and the tarball path run one
        implementation.

        Unauthenticated like `/v1/node/enroll`: a host with nothing installed
        has no credential to present. The enrollment token it is handed is
        single-use and expires in 10 minutes, and that is what authorizes the
        join. This is the pull direction; `POST /v1/node-installs` is the push
        direction, which needs ssh *to* the host.
      security: []
      responses:
        '200':
          description: "The script (`text/x-shellscript`, `cache-control: no-store`)."
        '405':
          description: |
            Not a GET. This is the only 4XX the route has: the script is
            embedded in the binary and its only input is the request's `Host`,
            so there is nothing per-request to reject. Deliberately **not** a
            `404` when no bundle is configured — `curl -f | bash` turns a 4XX
            into a silent no-op, and the script's own "is AGENTGRID_NODE_DIST
            set?" message is the one an operator can act on.
  /v1/node/install.sh:
    get:
      summary: The node installer the join script delegates to
      description: |
        `deploy/install-node.sh` verbatim, so a host that cannot run the join
        script can still fetch the installer and drive it by hand. Takes the
        server URL, the token, a `--staging` directory of verified binaries and
        optionally `--data-dir`/`--bin-dir`/`--adapters`.
      security: []
      responses:
        '200':
          description: "The installer (`text/x-shellscript`, `cache-control: no-store`)."
        '405':
          description: |
            Not a GET. Like `/v1/node/join.sh`, the installer is embedded in the
            binary, so a wrong method is the only way this route can be
            refused.
  /v1/node/bundle:
    get:
      summary: Manifest of the node bundle this control plane can serve
      description: |
        One line per file — `<name> <size> <sha256>` — preceded by
        `# arch=<arch> os=<os>`. Plain text rather than JSON on purpose: the
        consumer is a shell script on a host that may have no JSON parser, and
        the format is one `read` away.

        The bundle is whatever `AGENTGRID_NODE_DIST` holds (default: the
        directory the control plane runs from), restricted to
        `agentgrid-node-daemon*` and `adapter-*` at the top level. The `arch`
        line is what lets the script refuse to install an x86-64 daemon on an
        arm host instead of producing `Exec format error` later.

        `404` when no bundle is configured, so the panel can explain it.
      security: []
      responses:
        '200':
          description: "The manifest (`text/plain`)."
        '404':
          description: No `agentgrid-node-daemon` in `AGENTGRID_NODE_DIST`.
  /v1/node/bundle/{name}:
    get:
      summary: One file from the node bundle
      description: |
        The bytes plus an `x-agentgrid-sha256` header carrying the same digest
        the manifest lists. Only the daemon and `adapter-*` files at the top
        level of the dist directory are served, and the resolved path must stay
        inside it — that directory is operator-chosen, and an endpoint that
        serves "whatever is in this folder" is a reader for any file the control
        plane can open.
      security: []
      parameters:
        - name: name
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: "The file (`application/octet-stream`)."
        '404':
          description: Not in the bundle.
  /v1/node/heartbeat:
    post:
      summary: Publish node status/load/capabilities (node credentials)
      security: [{ nodeAuth: [] }]
  /v1/node/poll:
    post:
      summary: Long-poll a node for an assignment (node credentials)
      description: |
        Plan 0.3 item 1.2: with the `x-agentgrid-max-batch: N` request
        header the response `assignments` array carries up to N assignments
        (capped at the node's free concurrency slots) made in one write
        transaction; without the header exactly the legacy single
        `assignment` semantics apply.

        `adapter_env` carries the node's CP-managed env **sealed to its
        X25519 key** (ADR 0028); `adapter_env_complete` marks the list as the
        node's whole set rather than a delta, so an empty list revokes.
        Protocol-1 nodes (no `adapter_env_complete`) are sent no adapter env
        at all — the entries are ciphertext they would read as the value.
      security: [{ nodeAuth: [] }]
  /v1/node/ws:
    get:
      summary: Node WebSocket control channel upgrade (node credentials)
      description: |
        Plan 0.3 item 2.2 (ADR 0009): WebSocket upgrade carrying only
        control messages — assignment push, ack, cancel, heartbeat.
        `Authorization: Bearer <node-credential>` is checked at handshake
        (401 without upgrade). Message envelopes and close codes:
        `docs/node-ws-protocol.md`. Polling remains the N-1 fallback with
        identical scheduling semantics.
      security: [{ nodeAuth: [] }]
  /v1/node/attempts/{id}/ack:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    post:
      summary: Acknowledge an assignment started (node credentials)
      security: [{ nodeAuth: [] }]
  /v1/node/attempts/{id}/begin_validate:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    post:
      summary: Signal the post-agent validation command has started (node credentials)
      description: |
        Moves the attempt (and task) `running → validating` (CAS). Idempotent:
        a retried signal on an already-validating/terminal attempt returns 200
        without error; a stale fencing token yields 409.
      security: [{ nodeAuth: [] }]
  /v1/node/attempts/{id}/events:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    post:
      summary: Ingest a batch of adapter events (node credentials)
      security: [{ nodeAuth: [] }]
  /v1/node/attempts/{id}/complete:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    post:
      summary: Report a terminal completion (node credentials)
      description: |
        Idempotent on terminal attempts — a late/stale completion is
        rejected, audited as `complete.rejected_terminal` (with the source
        attempt status), and acked without corrupting the task status.
      security: [{ nodeAuth: [] }]
  /v1/node/attempts/{id}/cancel:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    get:
      summary: Poll whether cancellation was requested (node credentials)
      security: [{ nodeAuth: [] }]
  /v1/node/attempts/{id}/session:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    post:
      summary: Open an agent session for an attempt (node credentials)
      security: [{ nodeAuth: [] }]
  /v1/node/attempts/{id}/artifacts:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    post:
      summary: Upload a JSON artifact (node credentials)
      security: [{ nodeAuth: [] }]
  /v1/node/attempts/{id}/artifacts/raw:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    post:
      summary: Upload a binary artifact (node credentials)
      security: [{ nodeAuth: [] }]
  /v1/node/tasks/{id}/artifacts/{name}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
      - name: name
        in: path
        required: true
        schema: { type: string }
    get:
      summary: Fetch an artifact for streaming (node credentials)
      security: [{ nodeAuth: [] }]
  /v1/repositories:
    get:
      summary: List repositories
    post:
      summary: Register a repository (admin)
  /v1/workflows:
    get:
      summary: List workflow definitions
    post:
      summary: Create a workflow definition
  /v1/workflows/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    get:
      summary: Fetch a workflow definition
  /v1/workflows/{id}/runs:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    post:
      summary: Start a workflow run from a definition
  /v1/assembly:
    post:
      summary: One-button assembly — goal in, ephemeral architect template + marked run out (admin)
  /v1/workflows/{id}/schedules:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    get:
      summary: List schedules for a workflow
    post:
      summary: Create a schedule for a workflow
  /v1/workflows/{id}/schedules/{sid}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
      - name: sid
        in: path
        required: true
        schema: { type: string }
    delete:
      summary: Delete a schedule
  /v1/workflow-runs:
    get:
      summary: List workflow runs
  /v1/workflow-runs/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    get:
      summary: Fetch a workflow run
  /v1/workflow-runs/{id}/approve-plan:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    post:
      summary: Approve an architect plan (PlanReady -> expand)
  /v1/workflow-runs/{id}/cancel:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    post:
      summary: Cancel a workflow run
  /v1/workflow-runs/{id}/plan:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    get:
      summary: Fetch the emitted plan (PlanReady)
  /v1/workflow-runs/{id}/projection:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    get:
      summary: Fetch the run projection (roles/nodes/verdicts)
  /v1/workflow-runs/{id}/tick:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    post:
      summary: Advance the run one scheduler tick (admin/debug)
  /v1/approvals:
    get:
      summary: List pending approvals
  /v1/audit:
    get:
      summary: Newest-first audit trail of control-plane decisions
      description: |
        Query: `action` (exact-match filter, optional), `limit` (1..500,
        default 100). Returns `{items: AuditEvent[]}`; 503 on storage outage.
  /v1/approvals/{id}/allow:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    post:
      summary: Allow a pending approval
  /v1/approvals/{id}/deny:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    post:
      summary: Deny a pending approval
  /v1/approvals/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    get:
      summary: Fetch an approval
  /v1/conversations:
    get:
      summary: List conversations
  /v1/conversations/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    get:
      summary: Fetch a conversation
  /v1/conversations/{id}/messages:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    get:
      summary: List messages in a conversation
  /v1/profiles:
    get:
      summary: List agent profiles
    post:
      summary: Create/revise an agent profile
  /v1/profiles/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    get:
      summary: Fetch a profile
    post:
      summary: Create a new profile revision
  /v1/profiles/{id}/activate:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    post:
      summary: Mark a profile revision active
  /v1/mcp-servers:
    get:
      summary: List MCP server registry entries
    post:
      summary: Create an MCP server registry entry
      description: |
        Plan 2.2 (#5): the command line is statically scanned for known
        malicious patterns (exfiltration sinks, instruction override, hidden
        shell, hard-coded secrets). A Critical finding rejects registration
        with 422; warnings are allowed.
  /v1/mcp-servers/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    delete:
      summary: Delete an MCP server registry entry
  /v1/policy/evaluate:
    post:
      summary: Evaluate an autonomy policy decision
  /v1/skills:
    get:
      summary: List discovered skills (operator-trusted)
  /v1/skills/{name}:
    parameters:
      - name: name
        in: path
        required: true
        schema: { type: string }
    get:
      summary: Fetch a single skill's trust state
  /v1/repos/{repo}/learnings:
    parameters:
      - name: repo
        in: path
        required: true
        schema: { type: string }
    get:
      summary: List repo learnings (Plan 2.8 #19)
      description: |
        Returns every learning for the repository, ordered by confidence
        DESC, updated_at DESC. `?approved=true|false` filters by the review
        flag; `?limit=N` caps the page (default 100).
      parameters:
        - name: repo
          in: path
          required: true
          schema: { type: string }
        - name: approved
          in: query
          schema: { type: boolean }
        - name: limit
          in: query
          schema: { type: integer, default: 100 }
    post:
      summary: Add a repo learning (starts pending approval)
      parameters:
        - name: repo
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [repository, statement]
              properties:
                repository: { type: string }
                statement: { type: string }
                confidence: { type: number, default: 0.5, minimum: 0, maximum: 1 }
                source_attempt_id: { type: [string, "null"] }
  /v1/learnings/{id}/approve:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    post:
      summary: Approve (or demote) a repo learning
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                approved: { type: boolean, default: true }
  /v1/learnings/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    delete:
      summary: Remove a repo learning
      responses:
        '204': { description: Removed }
        '404': { description: Not found }
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
  /v1/adapter-env:
    get:
      summary: List CP-managed adapter env entries
      description: |
        Entries pushed to nodes on poll and injected into attempt process
        env (adapter match or `*`; node_id NULL = global). Local node env
        wins on key collision.
      responses:
        '200': { description: OK }
        '401': { $ref: '#/components/responses/Unauthorized' }
    put:
      summary: Upsert an adapter env entry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [adapter, key, value]
              properties:
                adapter: { type: string, description: "Adapter id or '*'" }
                key: { type: string, description: "Env var name (ASCII uppercase)" }
                value: { type: string }
                node_id: { type: string, description: 'Omit for global' }
      responses:
        '200': { description: Upserted }
        '400': { description: Invalid adapter/key }
  /v1/adapter-env/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    delete:
      summary: Remove an adapter env entry
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        '204': { description: Removed }
        '404': { description: Not found }
  /v1/proxies:
    get:
      summary: List CP-managed egress proxies
      description: |
        Global pool (node_id null) first, then node-scoped rows. Nodes
        receive their effective list (global + own) in every poll response
        and rotate on failure (dead proxy is retried after 5 minutes).
      responses:
        '200': { description: OK }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      summary: Register an egress proxy
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url]
              properties:
                url: { type: string, description: 'Scheme http/https/socks5' }
                node_id: { type: string, description: 'Omit for the global pool' }
      responses:
        '201': { description: Created }
        '400': { description: Invalid proxy URL }
        '409': { description: Already registered }
  /v1/proxies/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    delete:
      summary: Remove an egress proxy
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        '204': { description: Removed }
        '404': { description: Not found }
  /v1/skills/{name}/trust:
    parameters:
      - name: name
        in: path
        required: true
        schema: { type: string }
    post:
      summary: Trust a skill
  /v1/skills/{name}/untrust:
    parameters:
      - name: name
        in: path
        required: true
        schema: { type: string }
    post:
      summary: Untrust a skill (fail-closed)
components:
  schemas:
    Agent:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        role: { type: string }
        prompt: { type: string }
        skills: { type: array, items: { type: string } }
        budget_usd: { type: number }
        max_tasks: { type: [integer, "null"] }
        heartbeat_interval_secs: { type: [integer, "null"] }
        last_heartbeat_at: { type: [string, "null"] }
        created_at: { type: string }
        tasks_spent: { type: integer }
    AgentAction:
      type: object
      properties:
        id: { type: string }
        agent_id: { type: string }
        action: { type: string }
        detail: { type: string }
        created_at: { type: string }
    ErrorEnvelope:
      type: object
      description: Single machine-readable error body used by every structured error response.
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              description: |
                Stable machine-readable code: `invalid_state_transition`,
                `artifact_hash_mismatch`, `batch_too_large`, `rate_limited`,
                `not_found`, `unauthorized`, `forbidden`, `internal_error`,
                `service_unavailable`.
            message: { type: string }
            request_id:
              type: string
              description: Matches the `X-Request-Id` response header.
    OpencodeOverride:
      type: object
      description: |
        Per-task opencode config override, merged shallowly over the node's
        active profile and injected as OPENCODE_CONFIG_CONTENT (dies with the
        adapter process).
      properties:
        model: { type: [string, "null"] }
        small_model: { type: [string, "null"] }
        config:
          type: [object, "null"]
          additionalProperties: true
          description: Partial opencode config object; override keys win.
    CreateTaskRequest:
      type: object
      description: |
        Body of `POST /v1/tasks` (and of `POST /v1/agents/{id}/tasks`, where it
        is additionally attributed to an org agent). Only `prompt`,
        `repository` and `adapter` are mandatory; every other field is an
        optional refinement.
      required: [prompt, repository, adapter]
      properties:
        prompt:
          type: string
          description: The instruction handed to the agent.
        repository:
          type: string
          description: Repository the node checks out before running the agent.
        adapter:
          type: string
          description: Adapter name to run (e.g. `opencode`, `claude-code`).
        requested_node_id:
          type: [string, "null"]
          description: Pin the task to one node. Absent/null => the scheduler picks any eligible node.
        timeout_secs:
          type: [integer, "null"]
          minimum: 0
          description: Per-task timeout in seconds; server default when unset.
        validation_command:
          type: [string, "null"]
          description: Validation command overriding the repository default.
        base_commit:
          type: [string, "null"]
          description: Exact commit to check out; null => branch from the repository default branch.
        parent_acp_session_id:
          type: [string, "null"]
          description: ACP session to resume; null => a fresh session.
        consensus_group_id:
          type: [string, "null"]
          description: Consensus-run tag. Set by the CP when one prompt is fanned out to N adapters.
        consensus_member:
          type: [string, "null"]
          description: Member name of this task inside the consensus group (the adapter name).
        consensus_mode:
          type: [string, "null"]
          enum: [solve, review]
          description: |
            `solve` (default) = N models solve one task, patches compared by
            SHA. `review` = N models review one diff, verdicts compared.
        review_of:
          type: [string, "null"]
          description: For `consensus_mode = review`, the task id whose `changes.patch` this group judges.
        max_tokens:
          type: [integer, "null"]
          minimum: 0
          description: |
            Per-task token ceiling. The attempt is killed with
            `error_code = "budget_exceeded"` once reported usage passes it.
            Zero means zero tolerance; null means unbounded.
        max_cost_cents:
          type: [integer, "null"]
          minimum: 0
          description: Per-task cost ceiling in cents (same semantics as `max_tokens`).
        network_mode:
          type: [string, "null"]
          enum: [none, restricted, unrestricted]
          description: Requested network mode; must not exceed the node's maximum allowed mode.
        security_profile:
          type: [string, "null"]
          description: |
            Security profile name. A profile ending in `-strict` restricts
            assignment to nodes with structured permission interception.
        group_id:
          type: [string, "null"]
          description: Shared-context task group; parallel tasks in a group share `shared_context` notes and get `AG_GROUP_ID`.
        agent_id:
          type: [string, "null"]
          description: Org-agent attribution. The task counts against that agent's budget (409 when exhausted).
        opencode_override:
          anyOf:
            - $ref: "#/components/schemas/OpencodeOverride"
            - type: "null"
        github_push:
          type: boolean
          default: false
          description: |
            Push the agent branch, open a PR and (with `github_issue`) comment
            on the issue after a successful attempt. Best-effort: a write-back
            failure never fails the task.
        github_repo:
          type: [string, "null"]
          description: GitHub repository `owner/name` for write-back.
        github_issue:
          type: [integer, "null"]
          description: Issue number to comment on after a successful write-back.
        github_base_ref:
          type: [string, "null"]
          description: Base ref the PR targets; falls back to the repository default branch.
        github_create:
          type: boolean
          default: false
          description: With `github_push` + `github_repo`, create the remote repository if it does not exist yet.
        max_attempts:
          type: integer
          default: 1
          minimum: 1
          description: |
            Total attempts allowed. `1` = no auto-retry. When an attempt fails
            (never on cancel) and fewer than `max_attempts` have run, the task
            is re-queued instead of staying failed.
        retry_on_node_loss:
          type: [boolean, "null"]
          default: true
          description: |
            Whether losing the node may spend the `max_attempts` budget. A lost
            attempt is the one failure the control plane has no evidence about
            — the node died mid-run and never reported what the agent did — so
            retrying is only safe when the work is idempotent. `false` keeps
            node loss terminal (`failed` / `node_lost`). The retry is steered
            onto a *different* node: the one that lost the attempt is skipped
            while another node is online.
    TaskView:
      type: object
      description: A task as returned by the control plane.
      required: [id, repository, prompt, adapter, status, created_at]
      properties:
        id: { type: string }
        repository: { type: string }
        prompt: { type: string }
        adapter: { type: string }
        status:
          type: string
          enum: [queued, assigned, running, validating, succeeded, failed, cancelled]
        created_at: { type: string }
        finished_at: { type: [string, "null"] }
        assigned_attempt_id: { type: [string, "null"] }
        validation_command: { type: [string, "null"] }
        error_code:
          type: [string, "null"]
          description: |
            Failure category when the task did not end cleanly — `agent_failed`,
            `validation_failed`, `timeout`, `node_lost`, `budget_exceeded`. Null
            on success or a clean cancel.
        requested_node_id: { type: [string, "null"] }
        base_commit: { type: [string, "null"] }
        parent_acp_session_id: { type: [string, "null"] }
        network_mode:
          type: [string, "null"]
          enum: [none, restricted, unrestricted]
        security_profile:
          type: [string, "null"]
          description: |
            Security profile of the latest attempt, echoed so operators can see
            the policy the agent ran under. Before an attempt records
            provenance this falls back to the profile the task requested, so
            a queued task does not read back as unset.
        group_id: { type: [string, "null"] }
        agent_id: { type: [string, "null"] }
        consensus_group_id: { type: [string, "null"] }
        consensus_member: { type: [string, "null"] }
        consensus_mode:
          type: [string, "null"]
          enum: [solve, review]
        review_of: { type: [string, "null"] }
        opencode_override:
          anyOf:
            - $ref: "#/components/schemas/OpencodeOverride"
            - type: "null"
        github_repo: { type: [string, "null"] }
        github_issue: { type: [integer, "null"] }
        github_base_ref: { type: [string, "null"] }
        github_create: { type: boolean }
        rework_of:
          type: [string, "null"]
          description: Attempt id this task was created from via `POST /v1/attempts/{id}/rework`; null for original tasks.
        max_attempts:
          type: integer
          minimum: 1
          description: Total attempts allowed (echoed from the request; `1` = no auto-retry).
        max_tokens: { type: [integer, "null"] }
        max_cost_cents: { type: [integer, "null"] }
  responses:
    Unauthorized:
      description: |
        Missing, malformed or expired credential. Body follows the error
        envelope with `code = "unauthorized"`.
      headers:
        X-Request-Id:
          schema: { type: string }
          description: Correlation id, echoed from or minted for the request.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
  securitySchemes:
    userAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: User JWT from `/v1/auth/setup` (first user) or `/v1/auth/login`.
    nodeAuth:
      type: http
      scheme: bearer
      description: Node credential issued at enrollment.
