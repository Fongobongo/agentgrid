openapi: 3.1.0
info:
  title: AgentGrid Control Plane API
  version: 0.1.0
  description: |
    Public REST API of the AgentGrid control plane (`/v1` prefix). All
    node-facing routes (`/v1/node/*`) require node credentials; user-facing
    routes require a JWT obtained from `/v1/auth/setup` (first user) or
    `/v1/auth/login`. WebSocket is **not** part of the MVP — event streaming
    uses SSE at `/v1/tasks/{id}/events/stream`.

    This document is a generated summary of the public surface; see
    `crates/control-plane/src/lib.rs` for the authoritative route table.

    ## Error envelope (hardening P2 item 19)

    Handlers that return structured errors use a single machine-readable body:

    ```json
    {
      "error": {
        "code": "invalid_state_transition",
        "message": "attempt cannot transition from its current state",
        "request_id": "<uuid>"
      }
    }
    ```

    Stable codes: `invalid_state_transition` (409), `artifact_hash_mismatch`
    (422), `batch_too_large` (413), `rate_limited` (429), `not_found` (404),
    `unauthorized` (401), `forbidden` (403), `internal_error` (500),
    `service_unavailable` (503). Every response carries an `X-Request-Id`
    header (echoed/used for log correlation); the body `request_id` matches a
    freshly minted id for clients that only read the body.

paths:
  /health/live:
    get:
      summary: Liveness probe (always 200)
  /health/ready:
    get:
      summary: Readiness probe (DB + disk-writable check)
  /metrics:
    get:
      summary: Prometheus metrics endpoint
  /v1/auth/setup:
    post:
      summary: Create the first admin user (one-time)
      description: Fails with 409 once a user exists. Returns a JWT on success.
  /v1/auth/login:
    post:
      summary: Exchange credentials for a JWT
  /v1/auth/logout:
    post:
      summary: Invalidate the current JWT
  /v1/users:
    get:
      summary: List users (username + role)
      description: Plan 5.2 RBAC. Admin view of local accounts.
    post:
      summary: Create a user (admin only)
      description: |
        Body `{ "username", "password", "role"? }` where role is `admin` or
        `operator` (defaults to `operator`). Operators may only view (GET) and
        approve/deny; all other mutating calls return 403. Non-admin callers
        receive 403 from the RBAC middleware.
  /v1/admin/backup:
    post:
      summary: Snapshot the SQLite DB (VACUUM INTO) to a downloadable artifact
  /v1/admin/storage-gc:
    post:
      summary: Reconcile the artifact tree against metadata (orphan GC)
      description: |
        Body `{ "dry_run": bool }`. Reports `orphan_files`, `orphan_bytes`,
        `metadata_without_file` and `free_mb`. With `dry_run: false` orphan
        files are unlinked and dangling metadata rows pruned. Audited as
        `storage.gc`.
  /v1/tasks:
    get:
      summary: List tasks
      description: |
        Optional filters `status` / `repository` / `node_id` (exact match).
        Keyset pagination: pass `after_created_at` + `after_id` (the last
        row's values) to fetch the next page; `limit` caps the page (server
        ceiling 1000). Order is stable `(created_at, id)`.
      parameters:
        - name: status
          in: query
          schema: { type: string }
        - name: repository
          in: query
          schema: { type: string }
        - name: node_id
          in: query
          schema: { type: string }
        - name: after_created_at
          in: query
          schema: { type: string }
        - name: after_id
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer }
    post:
      summary: Create a task
  /v1/tasks/{id}:
    get:
      summary: Fetch a task by id
      description: |
        Task view includes `security_profile` — the security profile of the
        latest attempt (from `attempts.provenance.security_profile`), so
        operators can see the policy the agent ran under.
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
  /v1/tasks/{id}/cancel:
    post:
      summary: Request cancellation of a running task
  /v1/tasks/{id}/retry:
    post:
      summary: Re-queue a failed/cancelled task
  /v1/search:
    get:
      summary: Full-text search over tasks (FTS5)
      description: |
        Plan 1.3 (#6): matches the prompt/repository via the FTS5 mirror,
        ranked by bm25, capped at 50 rows. `q` is tokenized; punctuation is
        quoted so it does not break the query.
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string }
  /v1/attempts/{id}:
    get:
      summary: Fetch a single attempt (prompt included)
      description: |
        Plan 1.3 (#13): attempt detail used by `ag resume` to inherit the
        owning task's prompt/context without a second lookup.
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
  /v1/attempts/{id}/annotations:
    get:
      summary: List inline annotations on an attempt's diff/plan
      description: Plan 1.6 (#3b): reviewer comments pinned to file/line.
    post:
      summary: Leave an inline annotation
      description: |
        Plan 1.6 (#3b): create a comment pinned to a file (and optional
        1-based line range) on an attempt's diff/plan. Stored in SQLite as
        `patch_annotations`; folded into a rework task prompt by
        `POST /v1/attempts/{id}/rework`.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [file, comment]
              properties:
                file: { type: string }
                line_start: { type: integer }
                line_end: { type: integer }
                comment: { type: string }
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
  /v1/attempts/{id}/rework:
    post:
      summary: Send an attempt for rework with the annotations as feedback
      description: |
        Plan 1.6 (#3b): creates a NEW task whose prompt is the original
        prompt plus an `[ANNOTATIONS]` block built from the attempt's inline
        annotations. Returns the new task id.
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
      responses:
        '201':
          description: Rework task created
          content:
            application/json:
              schema:
                type: object
                properties:
                  task_id: { type: string }
  /v1/tasks/{id}/review-approval:
    get:
      summary: Fetch the pending patch-review approval for a task
      description: |
        Plan 1.1: a successful attempt creates a pending `task_patch_review`
        approval. Returns it (or `null`) so the UI shows Accept / Reject /
        Request rework.
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
  /v1/tasks/{id}/tags:
    get:
      summary: List a task's tags
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
  /v1/tasks/{id}/tags/{tag}:
    post:
      summary: Add a tag to a task (idempotent)
    delete:
      summary: Remove a tag from a task
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
      - name: tag
        in: path
        required: true
        schema: { type: string }
  /v1/webhooks/github/issues:
    post:
      summary: GitHub issue webhook → create a task
      description: |
        Plan 1.4 (#2a): verifies the `X-Hub-Signature-256` HMAC-SHA256
        signature against `AGENTGRID_GITHUB_WEBHOOK_SECRET`, then creates a
        task from the issue body when the issue carries the `agent` label.
        Disabled (404) when the secret is unset.
  /v1/webhooks/github/check_run:
    post:
      summary: GitHub check_run webhook → spawn a CI-fix task
      description: |
        Plan 1.10 (#1): on `action=completed` + `conclusion in {failure,
        cancelled}` spawns an autonomous CI-fix task — the agent reads the
        failed check's log and attempts the minimal fix. Success/skipped
        conclusions are acked silently. HMAC verified via
        `AGENTGRID_GITHUB_WEBHOOK_SECRET`; disabled (404) when unset.
  /v1/webhooks/github/pull_request:
    post:
      summary: GitHub pull_request webhook → spawn a conflict-resolve task
      description: |
        Plan 1.10 (#1): on `action in {opened, synchronize, reopened}` with
        `pull_request.mergeable_state == "conflicting"` spawns an autonomous
        merge-conflict resolve task — the agent rebases and resolves
        conflicts to make the PR mergeable. Clean/blocked states are acked
        silently. HMAC verified via `AGENTGRID_GITHUB_WEBHOOK_SECRET`;
        disabled (404) when unset.
  /v1/task-groups/{id}/context:
    get:
      summary: List shared-context notes for a task group
      description: |
        Plan 1.12 (#7): all notes written by attempts of a logical task
        group (flat key→value, ordered by key). Empty array when none.
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
  /v1/agents:
    post:
      summary: Register an org agent (plan 2.1 #18)
      description: |
        Long-lived agent identity with a role, prompt template, attached
        skills, a display budget (USD) and an optional hard task stop
        (max_tasks). Heartbeat interval (seconds) enables scheduled task
        spawning. 400 on invalid name/role; 409 on duplicate name.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
                role: { type: string, default: worker }
                prompt: { type: string, default: "" }
                skills: { type: array, items: { type: string } }
                budget_usd: { type: number, default: 0 }
                max_tasks: { type: integer, nullable: true }
                heartbeat_interval_secs: { type: integer, nullable: true }
      responses:
        "201":
          description: Agent created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Agent" }
    get:
      summary: List org agents with current task spend
      responses:
        "200":
          description: Agents
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Agent" }
  /v1/agents/{id}/actions:
    get:
      summary: An agent's immutable action trail (plan 2.1 #18)
      description: Newest first, capped at 500 rows.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Trail rows
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AgentAction" }
  /v1/agents/{id}/tasks:
    post:
      summary: Create a task attributed to an agent (plan 2.1 #18)
      description: |
        Counts against the agent's max_tasks budget; 409 when exhausted or
        the agent is unknown. Body is a normal create-task request.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateTaskRequest" }
      responses:
        "201":
          description: Task created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TaskView" }
        "409":
          description: Budget exhausted or unknown agent
  /v1/task-groups/{id}/context/{key}:
    get:
      summary: Read one shared-context note's value
      description: |
        Plan 1.12 (#7): returns the raw value string; 404 when the key is
        not set for the group.
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
      - name: key
        in: path
        required: true
        schema: { type: string }
    put:
      summary: Set (upsert) a shared-context note
      description: |
        Plan 1.12 (#7): overwrites the value for (group, key) and bumps
        updated_at. 204 on success. Keys must be path-safe alphanumerics /
        `-` / `_` / `.`; group ids validated as opaque ids.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [value]
              properties:
                value: { type: string }
    delete:
      summary: Delete a shared-context note (no-op when absent)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: key
          in: path
          required: true
          schema: { type: string }
  /v1/tasks/{id}/events:
    get:
      summary: List task events (polling)
      description: |
        Ordered by the global `ingest_id` cursor (migration 0037) so events
        from different attempts render in true time order after a retry.
        `after_ingest` resumes after that global cursor; legacy `after_sequence`
        (per-attempt) is still honoured. `limit` caps the page (default 1000).
      parameters:
        - name: after_ingest
          in: query
          required: false
          schema: { type: integer }
        - name: after_sequence
          in: query
          required: false
          schema: { type: integer }
        - name: limit
          in: query
          required: false
          schema: { type: integer }
  /v1/tasks/{id}/events/stream:
    get:
      summary: SSE event stream (Last-Event-ID resume supported)
      description: |
        The SSE `id:` field carries the global `ingest_id`; a reconnect sends it
        back as `Last-Event-ID` and resumes exactly where it stopped, across
        attempts.
  /v1/stream:
    get:
      summary: SSE change-notification stream for UI lists
      description: |
        Emits `hello` on connect and `change` whenever the status fingerprint
        (task/node/workflow-run counts by status) moves. Clients refetch their
        lists on those events; an idle client receives only 15 s keep-alives.
  /v1/tasks/{id}/approvals:
    get:
      summary: List pending approvals for a task
  /v1/tasks/{id}/eligibility:
    get:
      summary: Show scheduler eligibility reasoning for a task
  /v1/tasks/{id}/artifacts:
    get:
      summary: List a task's artifacts (latest attempt) with metadata
      description: |
        Plan 1.11 (#8): names, sizes, media types and sha256 of the task's
        artifacts on its latest attempt. Empty array when the task has no
        attempts or none uploaded artifacts.
  /v1/tasks/{id}/artifacts/{name}:
    get:
      summary: Download a named artifact by content
  /v1/nodes:
    get:
      summary: List registered nodes
      description: |
        Each node carries `unsafe_active` (unsafe unattended bypass active) and
        `permission_interception` (`structured` | `wrapper` | `none`) so
        operators can spot fully-unrestricted nodes. Also `outbox_bytes` and
        `artifact_spool_bytes` (hardening P2 item 35): local storage pressure —
        a node whose spool grows is backing up and not draining.
  /v1/nodes/{id}:
    get:
      summary: Fetch a node by id
  /v1/nodes/{id}/drain:
    post:
      summary: Drain / undrain a node for maintenance
      description: |
        `?drain=true` (default) stops NEW task assignments while in-flight
        attempts finish and the heartbeat stays online; `?drain=false`
        re-enables scheduling. Audited as `node.drain` / `node.undrain`.
        (hardening P2 item 37)
  /v1/nodes/{id}/accounts/usage:
    get:
      summary: Per-account usage for a node (provider failover metrics)
      description: |
        Plan 1.8 (#15): attempt counts and 429 rate-limits per credential
        env var, as reported by the node in its heartbeats. In-memory; empty
        list when the node never reported usage.
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
  /v1/nodes/enrollment-token:
    post:
      summary: Mint a one-time node enrollment token (admin)
  /v1/node/enroll:
    post:
      summary: Enroll a new node with a one-time token (node credentials)
  /v1/node/heartbeat:
    post:
      summary: Publish node status/load/capabilities (node credentials)
  /v1/node/poll:
    post:
      summary: Long-poll a node for an assignment (node credentials)
      description: |
        Plan 0.3 item 1.2: with the `x-agentgrid-max-batch: N` request
        header the response `assignments` array carries up to N assignments
        (capped at the node's free concurrency slots) made in one write
        transaction; without the header exactly the legacy single
        `assignment` semantics apply.
  /v1/node/ws:
    get:
      summary: Node WebSocket control channel upgrade (node credentials)
      description: |
        Plan 0.3 item 2.2 (ADR 0009): WebSocket upgrade carrying only
        control messages — assignment push, ack, cancel, heartbeat.
        `Authorization: Bearer <node-credential>` is checked at handshake
        (401 without upgrade). Message envelopes and close codes:
        `docs/node-ws-protocol.md`. Polling remains the N-1 fallback with
        identical scheduling semantics.
  /v1/node/attempts/{id}/ack:
    post:
      summary: Acknowledge an assignment started (node credentials)
  /v1/node/attempts/{id}/begin_validate:
    post:
      summary: Signal the post-agent validation command has started (node credentials)
      description: |
        Moves the attempt (and task) `running → validating` (CAS). Idempotent:
        a retried signal on an already-validating/terminal attempt returns 200
        without error; a stale fencing token yields 409.
  /v1/node/attempts/{id}/events:
    post:
      summary: Ingest a batch of adapter events (node credentials)
  /v1/node/attempts/{id}/complete:
    post:
      summary: Report a terminal completion (node credentials)
      description: |
        Idempotent on terminal attempts — a late/stale completion is
        rejected, audited as `complete.rejected_terminal` (with the source
        attempt status), and acked without corrupting the task status.
  /v1/node/attempts/{id}/cancel:
    get:
      summary: Poll whether cancellation was requested (node credentials)
  /v1/node/attempts/{id}/session:
    post:
      summary: Open an agent session for an attempt (node credentials)
  /v1/node/attempts/{id}/artifacts:
    post:
      summary: Upload a JSON artifact (node credentials)
  /v1/node/attempts/{id}/artifacts/raw:
    post:
      summary: Upload a binary artifact (node credentials)
  /v1/node/tasks/{id}/artifacts/{name}:
    get:
      summary: Fetch an artifact for streaming (node credentials)
  /v1/repositories:
    get:
      summary: List repositories
    post:
      summary: Register a repository (admin)
  /v1/workflows:
    get:
      summary: List workflow definitions
    post:
      summary: Create a workflow definition
  /v1/workflows/{id}:
    get:
      summary: Fetch a workflow definition
  /v1/workflows/{id}/runs:
    post:
      summary: Start a workflow run from a definition
  /v1/workflows/{id}/schedules:
    get:
      summary: List schedules for a workflow
    post:
      summary: Create a schedule for a workflow
  /v1/workflows/{id}/schedules/{sid}:
    delete:
      summary: Delete a schedule
  /v1/workflow-runs:
    get:
      summary: List workflow runs
  /v1/workflow-runs/{id}:
    get:
      summary: Fetch a workflow run
  /v1/workflow-runs/{id}/approve-plan:
    post:
      summary: Approve an architect plan (PlanReady -> expand)
  /v1/workflow-runs/{id}/cancel:
    post:
      summary: Cancel a workflow run
  /v1/workflow-runs/{id}/plan:
    get:
      summary: Fetch the emitted plan (PlanReady)
  /v1/workflow-runs/{id}/projection:
    get:
      summary: Fetch the run projection (roles/nodes/verdicts)
  /v1/workflow-runs/{id}/tick:
    post:
      summary: Advance the run one scheduler tick (admin/debug)
  /v1/approvals:
    get:
      summary: List pending approvals
  /v1/audit:
    get:
      summary: Newest-first audit trail of control-plane decisions
      description: |
        Query: `action` (exact-match filter, optional), `limit` (1..500,
        default 100). Returns `{items: AuditEvent[]}`; 503 on storage outage.
  /v1/approvals/{id}/allow:
    post:
      summary: Allow a pending approval
  /v1/approvals/{id}/deny:
    post:
      summary: Deny a pending approval
  /v1/approvals/{id}:
    get:
      summary: Fetch an approval
  /v1/conversations:
    get:
      summary: List conversations
  /v1/conversations/{id}:
    get:
      summary: Fetch a conversation
  /v1/conversations/{id}/messages:
    get:
      summary: List messages in a conversation
  /v1/profiles:
    get:
      summary: List agent profiles
    post:
      summary: Create/revise an agent profile
  /v1/profiles/{id}:
    get:
      summary: Fetch a profile
    post:
      summary: Create a new profile revision
  /v1/profiles/{id}/activate:
    post:
      summary: Mark a profile revision active
  /v1/mcp-servers:
    get:
      summary: List MCP server registry entries
    post:
      summary: Create an MCP server registry entry
  /v1/mcp-servers/{id}:
    delete:
      summary: Delete an MCP server registry entry
  /v1/policy/evaluate:
    post:
      summary: Evaluate an autonomy policy decision
  /v1/skills:
    get:
      summary: List discovered skills (operator-trusted)
  /v1/skills/{name}:
    get:
      summary: Fetch a single skill's trust state
  /v1/skills/{name}/trust:
    post:
      summary: Trust a skill
  /v1/skills/{name}/untrust:
    post:
      summary: Untrust a skill (fail-closed)
components:
  schemas:
    Agent:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        role: { type: string }
        prompt: { type: string }
        skills: { type: array, items: { type: string } }
        budget_usd: { type: number }
        max_tasks: { type: integer, nullable: true }
        heartbeat_interval_secs: { type: integer, nullable: true }
        last_heartbeat_at: { type: string, nullable: true }
        created_at: { type: string }
        tasks_spent: { type: integer }
    AgentAction:
      type: object
      properties:
        id: { type: string }
        agent_id: { type: string }
        action: { type: string }
        detail: { type: string }
        created_at: { type: string }
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    nodeCred:
      type: http
      scheme: bearer
      description: Node credential issued at enrollment.
