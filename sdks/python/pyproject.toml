[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "agentgrid-sdk"
version = "0.1.0"
description = "Thin Python SDK for the agentgrid control plane (/v1 HTTP API)"
requires-python = ">=3.9"
license = { text = "MIT" }

[tool.setuptools]
py-modules = ["agentgrid"]
