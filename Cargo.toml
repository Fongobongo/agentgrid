[workspace]
resolver = "2"
members = [
    "crates/common",
    "crates/control-plane",
    "crates/node-daemon",
    "crates/cli",
    "crates/adapters",
    "crates/skills",
    "crates/acp",
    "crates/gateway",
    "crates/edge",
    "crates/index",
    "crates/provision",
]
# cargo-fuzz crate: its own workspace (libfuzzer needs nightly + sanitizer
# flags that must not leak into the stable CI/test builds).
exclude = ["fuzz"]

[workspace.package]
version = "0.7.0"
edition = "2021"
license = "MIT"
# Real floor of the current Cargo.lock (sqlx 0.9 needs 1.94). Enforced by
# the MSRV job in ci.yml — bump both together, never silently.
rust-version = "1.94"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "2"
anyhow = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
axum = { version = "0.8", features = ["macros", "ws"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
clap = { version = "4", features = ["derive", "env"] }
clap_complete = "4"
chrono = { version = "0.4", features = ["serde"] }
tower = { version = "0.5", features = ["util"] }
sha2 = "0.11"
hmac = "0.13"
hex = "0.4"
regex = "1"
async-stream = "0.3"
futures-core = "0.3"
futures-util = "0.3"
argon2 = "0.6"
password-hash = { version = "0.6", features = ["getrandom", "phc"] }
# Exactly one JWT crypto backend must be enabled for automatic provider selection.
# Reuse the AWS-LC backend already used by tokio-rustls; RustCrypto pulls vulnerable
# crypto-bigint and unpatched rsa. Keep PEM support and all JWT algorithms intact.
# Native builds need a target C toolchain (and CMake on Windows); never re-enable
# rust_crypto through feature unification, including workspace --all-features.
jsonwebtoken = { version = "11", default-features = false, features = ["aws_lc_rs", "use_pem"] }
rand = "0.10"
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
# The node dials its control plane through an HTTP CONNECT tunnel when an egress
# proxy is configured (ADR 0026 follow-up), and tungstenite only does the TLS
# half if it is handed a rustls config. Both crates are already in the graph via
# tokio-tungstenite, so these lines add no new download — they only make the
# types reachable. `aws_lc_rs` is explicit rather than the default provider
# because `ring` is also in the graph and an ambiguous process default panics at
# the first handshake instead of at build time.
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "tls12", "std"] }
webpki-roots = "1"
base64 = "0.22"
# Stage 11.5 TUI: full-screen dashboards (ratatui + crossterm backend).
ratatui = "0.30"
crossterm = "0.29"
agentgrid-common = { path = "crates/common" }
agentgrid-adapters = { path = "crates/adapters" }
agentgrid-acp = { path = "crates/acp" }
agentgrid-skills = { path = "crates/skills" }
agentgrid-provision = { path = "crates/provision" }
agentgrid-index = { path = "crates/index" }
agentgrid-edge = { path = "crates/edge" }

# Stage 6.2: release profile tuned for small static binaries.
[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"
