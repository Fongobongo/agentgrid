[workspace]
resolver = "2"
members = [
    "crates/common",
    "crates/control-plane",
    "crates/node-daemon",
    "crates/cli",
    "crates/adapters",
    "crates/skills",
    "crates/acp",
    "crates/gateway",
]
# cargo-fuzz crate: its own workspace (libfuzzer needs nightly + sanitizer
# flags that must not leak into the stable CI/test builds).
exclude = ["fuzz"]

[workspace.package]
version = "0.4.4"
edition = "2021"
license = "MIT"
rust-version = "1.85"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "2"
anyhow = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
axum = { version = "0.8", features = ["macros", "ws"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
clap = { version = "4", features = ["derive", "env"] }
clap_complete = "4"
chrono = { version = "0.4", features = ["serde"] }
tower = { version = "0.5", features = ["util"] }
sha2 = "0.10"
regex = "1"
async-stream = "0.3"
futures-core = "0.3"
futures-util = "0.3"
argon2 = "0.5"
password-hash = { version = "0.5", features = ["std"] }
jsonwebtoken = "9"
rand = "0.8"
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
# Stage 11.5 TUI: full-screen dashboards (ratatui + crossterm backend).
ratatui = "0.30"
crossterm = "0.29"
agentgrid-common = { path = "crates/common" }
agentgrid-adapters = { path = "crates/adapters" }
agentgrid-acp = { path = "crates/acp" }
agentgrid-skills = { path = "crates/skills" }

# Stage 6.2: release profile tuned for small static binaries.
[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"
