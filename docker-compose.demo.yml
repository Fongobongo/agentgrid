# Local demo stack with insecure baked-in defaults for fast hacking.
# NOT for production: anyone on the network can log in as demo/demo.
# Production uses docker-compose.yml + deploy/compose/up.sh (random secrets).
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  control-plane:
    image: ag-cp:test
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "7800:7800"
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:7800/health/ready"]
      interval: 15s
      timeout: 5s
      start_period: 10s
      retries: 3
    environment:
      # Demo-only static JWT secret; replace for any non-local use.
      AGENTGRID_JWT_SECRET: demo-insecure-jwt-secret-32bytes-min-change-me
      AGENTGRID_LISTEN: 0.0.0.0:7800
    volumes:
      - agentgrid-demo-data:/var/lib/agentgrid

  node-1:
    image: ag-node:test
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      control-plane:
        condition: service_healthy
    # 60s attempt drain + durable-completion redelivery needs room to finish.
    stop_grace_period: 90s
    healthcheck:
      test: ["CMD-SHELL", "test $(( $(date +%s) - $(stat -c %Y /var/lib/agentgrid/data/heartbeat.stamp 2>/dev/null || echo 0) )) -lt 30"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 3
    environment:
      AGENTGRID_SERVER: http://control-plane:7800
      # Required: without a real enroll token the node crash-loops with no
      # hint. Mint tokens via `ag token create` and export NODE1_TOKEN.
      AGENTGRID_ENROLL_TOKEN: ${NODE1_TOKEN:?set NODE1_TOKEN (ag token create)}
      AGENTGRID_NODE_NAME: node-1
      AGENTGRID_MAX_CONCURRENCY: "2"
      # Keep workspace/repo state on the mounted volume, not the container fs.
      AGENTGRID_WORKSPACE_ROOT: /var/lib/agentgrid/data/workspace
      AGENTGRID_REPOSITORY_ROOT: /var/lib/agentgrid/data/repos
    volumes:
      - agentgrid-demo-node1:/var/lib/agentgrid/data

  node-2:
    image: ag-node:test
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      control-plane:
        condition: service_healthy
    # 60s attempt drain + durable-completion redelivery needs room to finish.
    stop_grace_period: 90s
    healthcheck:
      test: ["CMD-SHELL", "test $(( $(date +%s) - $(stat -c %Y /var/lib/agentgrid/data/heartbeat.stamp 2>/dev/null || echo 0) )) -lt 30"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 3
    environment:
      AGENTGRID_SERVER: http://control-plane:7800
      AGENTGRID_ENROLL_TOKEN: ${NODE2_TOKEN:?set NODE2_TOKEN (ag token create)}
      AGENTGRID_NODE_NAME: node-2
      AGENTGRID_MAX_CONCURRENCY: "2"
      AGENTGRID_WORKSPACE_ROOT: /var/lib/agentgrid/data/workspace
      AGENTGRID_REPOSITORY_ROOT: /var/lib/agentgrid/data/repos
    volumes:
      - agentgrid-demo-node2:/var/lib/agentgrid/data

volumes:
  agentgrid-demo-data:
  agentgrid-demo-node1:
  agentgrid-demo-node2:
