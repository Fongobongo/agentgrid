# Config for `redocly lint docs/openapi.yaml` (CI job "openapi" in ci.yml).
#
# `operation-operationId` is off on purpose. The TypeScript client in
# `web/src/api.ts` is hand-written and addresses routes by path, so operation
# ids would be identifiers nobody consumes — 121 warnings that drowned out the
# ones that matter. With the rule off, ANY problem fails the job, which is the
# point: the rules the contract test cannot express (path parameters declared
# for every `{placeholder}`, OpenAPI 3.1 nullable, unused components, a 4xx on
# every operation) are exactly the ones that silently rotted before.
extends:
  - recommended
rules:
  operation-operationId: off
