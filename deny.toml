# cargo-deny policy (hardening P2 item 29 — complements `cargo audit` with
# license + banned-crates + source checks). Run via the `cargo-deny` job in
# supply-chain.yml. Schema is cargo-deny v0.20.

[graph]
all-features = true

[advisories]
# Fail the build on an unfixable vulnerability or a yanked crate. `cargo audit`
# is the canonical notifier; this is the policy enforcer for the same DB.
# Unmaintained crates are only warned (some — e.g. rustls-pemfile — have no
# safe upgrade yet and are explicitly tracked here).
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "deny"
# rustls-pemfile 2.2.0 is archived (RUSTSEC-2025-0134) with no safe upgrade; the
# PEM parsing it wraps is now in rustls-pki-types. Tracked under hardening #29 —
# migrate to `rustls_pki_types::pem::PemObject` when touching the TLS loader.
ignore = ["RUSTSEC-2025-0134"]

[licenses]
# Allow common OSS licenses; unknown / restriction surface here.
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "Unlicense",
]
confidence-threshold = 0.8
exceptions = []

[bans]
multiple-versions = "warn"
# Workspace path deps (`agentgrid-common.workspace = true`) carry no version
# needle and trip the wildcard check; allow them by relaxing to warn (the
# path still resolves to a fixed workspace crate — no real dependency risk).
wildcards = "warn"
deny = []
allow = []
skip = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
