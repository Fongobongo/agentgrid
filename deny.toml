# cargo-deny policy (hardening P2 item 29 — complements `cargo audit` with
# license + banned-crates + source checks). Run via the `cargo-deny` job in
# supply-chain.yml. Schema is cargo-deny v0.20.

[graph]
all-features = true

[advisories]
# Fail the build on an unfixable vulnerability or a yanked crate. `cargo audit`
# is the canonical notifier; this is the policy enforcer for the same DB.
# (cargo-deny >= 0.15 always errors on vulnerability/unsound/notice advisories
# and on unmaintained advisories in scope — there is no warn level. A finding
# that is accepted as tech debt must be listed in `ignore` with a reason, so
# it stays visible instead of silently passing.)
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "deny"
# rustls-pemfile 2.2.0 was archived (RUSTSEC-2025-0134); removed from the
# workspace in v0.3.9+ — the TLS loader now uses rustls-pki-types' PemObject
# (rustls 0.23 / pki-types ≥ 1.11). Ignore dropped from the list.
#
# RUSTSEC-2024-0437 (protobuf 2.28 recursion crash) was ignored here while
# `prometheus` pulled protobuf 2.x for metric encoding only (no untrusted
# protobuf parsed anywhere). prometheus has since moved to protobuf 3.7.2, so
# the ignore was dropped 2026-10-13 (mirrored in supply-chain.yml) — re-add
# only if protobuf 2.x lands back in Cargo.lock.
#
# RUSTSEC-2023-0071 (rsa Marvin Attack) used to be ignored here: sqlx 0.9 no
# longer pulls `rsa` at all, so the rule was removed — re-add only if the
# crate lands back in Cargo.lock.
ignore = [
    # RUSTSEC-2023-0071 (rsa Marvin Attack, no patch available). Pulled by
    # jsonwebtoken 11 via its `rust_crypto` backend (the only pure-Rust
    # backend; aws_lc_rs would need a C toolchain in the musl/static release
    # builds). Our JWT usage is HMAC-only: Header::default() (HS256),
    # EncodingKey/DecodingKey::from_secret, Validation::default() — no RSA
    # keys are configured and no RSA code path is reachable, so the timing
    # side channel does not apply (advisory workaround: avoid RSA where
    # attackers observe timing; we do no RSA at all). Mirrored in
    # supply-chain.yml (audit-check ignore). Re-evaluate the day an RSA
    # algorithm is configured anywhere.
    { id = "RUSTSEC-2023-0071", reason = "HMAC-only HS256 usage; rsa linked but unreachable" },
    # RUSTSEC-2026-0387 (crypto-bigint 0.5.5 constant-time variability).
    # Pulled by elliptic-curve 0.13.8 (p256/p384/ecdsa) under jsonwebtoken
    # 11's rust_crypto backend — the same linkage as the rsa entry above,
    # with the same reachability analysis: our JWT usage is HMAC-only
    # (HS256, from_secret, Validation::default), so no elliptic-curve
    # operation (and no crypto-bigint secret arithmetic) ever runs. Fix
    # requires crypto-bigint >=0.7.6, which needs elliptic-curve >=0.14 —
    # not publishable in-tree while jsonwebtoken pins 0.13. Re-evaluate
    # when the backend's elliptic-curve moves. Mirrored in
    # supply-chain.yml (audit-check ignore).
    { id = "RUSTSEC-2026-0387", reason = "HMAC-only HS256 usage; elliptic-curve (crypto-bigint) linked but unreachable; fix needs elliptic-curve >=0.14 under jsonwebtoken" },
]

[licenses]
# Allow common OSS licenses; unknown / restriction surface here.
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "Unlicense",
]
confidence-threshold = 0.8
exceptions = []

[bans]
multiple-versions = "warn"
# Workspace path deps (`agentgrid-common.workspace = true`) carry no version
# needle and trip the wildcard check; allow them by relaxing to warn (the
# path still resolves to a fixed workspace crate — no real dependency risk).
wildcards = "warn"
deny = []
allow = []
skip = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
