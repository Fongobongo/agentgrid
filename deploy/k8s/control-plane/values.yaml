# Default values for agentgrid-control-plane
# Production-ready configuration with high availability

replicaCount: 3

image:
  repository: openclaw/agentgrid-control-plane
  tag: "0.4.0"
  pullPolicy: IfNotPresent

# Resource limits for HA operation
resources:
  limits:
    cpu: "2"
    memory: "2Gi"
  requests:
    cpu: "250m"
    memory: "512Mi"

# Horizontal pod autoscaling
autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  # Custom metrics support via Prometheus Adapter
  customMetrics:
    - type: Pods
      pods:
        metricName: agentgrid_pending_tasks
        averageValue: "10"

# Pod disruption budget for zero-downtime upgrades
podDisruptionBudget:
  enabled: true
  minAvailable: 2

# Security context (hardened defaults)
securityContext:
  runAsNonRoot: true
  fsGroup: 1000
  runAsUser: 1000
  runAsGroup: 1000

podSecurityContext:
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false
  seccompProfile:
    type: RuntimeDefault
  capabilities:
    drop:
      - ALL

# Service configuration
service:
  type: ClusterIP
  port: 8080
  targetPort: 8080

# Ingress configuration
ingress:
  enabled: false
  className: traefik
  annotations:
    traefik.traefik.io/route.tls=true
    nginx.ingress.kubernetes.io/backend-protocol: "HTTP"
  hosts:
    - host: agentgrid.example.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: agentgrid-tls
      hosts:
        - agentgrid.example.com

# Storage configuration
persistence:
  enabled: false  # Use external PostgreSQL instead
  accessMode: ReadWriteOnce
  size: 10Gi
  storageClass: ""
  path: /var/lib/agentgrid/data

# External database configuration (recommended for production)
externalDatabase:
  enabled: false
  host: ""
  port: 5432
  database: agentgrid
  username: agentgrid
  passwordSecret:
    name: agentgrid-db-secret
    key: password
  sslMode: require

# SQLite local storage (dev/testing only)
localDatabase:
  enabled: true  # Default for simple deployments

# S3-compatible artifact storage
artifacts:
  storageType: local  # local, s3, gcs, azure
  # S3 configuration
  s3:
    bucket: ""
    region: us-east-1
    endpoint: ""  # For S3-compatible services
    accessKeySecret:
      name: agentgrid-s3-key
      key: access-key
    secretKeySecret:
      name: agentgrid-s3-secret
      key: secret-key

# Redis caching layer (optional, improves performance under load)
redis:
  enabled: false
  host: ""
  port: 6379
  passwordSecret:
    name: agentgrid-redis-secret
    key: password
  dbIndex: 0

# Logging configuration
logging:
  level: info  # debug, info, warn, error
  format: json  # json, text

# Health check probes
livenessProbe:
  httpGet:
    path: /healthz
    port: http
    scheme: HTTP
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /ready
    port: http
    scheme: HTTP
  initialDelaySeconds: 5
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 3

# Node selector and tolerations
nodeSelector: {}

tolerations: []

affinity: {}

# Environment variables (additional)
extraEnvVars: []
# - name: CUSTOM_VAR
#   value: "value"

# Secrets management (HashiCorp Vault integration)
vault:
  enabled: false
  address: https://vault.example.com:8200
  role: agentgrid
  secretsEngine: kv
  mountPath: kubernetes/agentgrid

# Metrics & monitoring
metrics:
  enabled: true
  serviceMonitor:
    enabled: true
    interval: 30s
    scrapeTimeout: 10s
    labels: {}

# Startup probe for slow deployments
startupProbe:
  httpGet:
    path: /healthz
    port: http
  failureThreshold: 30
  periodSeconds: 10

# Container lifecycle hooks
lifecycle:
  preStop:
    exec:
      command: ["/bin/sh", "-c", "sleep 2"]

# Tracing (OpenTelemetry)
tracing:
  enabled: false
  endpoint: ""  # OTLP collector endpoint
  samplingRate: 0.1

# Rate limiting at application level
rateLimiting:
  enabled: false
  requestsPerSecond: 100
  burstSize: 200
