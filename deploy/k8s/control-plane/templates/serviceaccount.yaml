{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "agentgrid.fullname" . }}
  namespace: {{ .Release.Namespace | default "default" }}
  labels:
    app.kubernetes.io/name: agentgrid-control-plane
    app.kubernetes.io/instance: {{ .Release.Name }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}

---

# Pod identity for cloud provider access (optional)
{{- if .Values.podIdentity.enabled }}
apiVersion: iam.eks.amazonaws.com/v1alpha1
kind: PodIdentityAssociation
metadata:
  name: {{ .Release.Name }}-control-plane-role
  namespace: {{ .Release.Namespace | default "default" }}
spec:
  clusterName: {{ .Values.podIdentity.clusterName }}
  principalArn: {{ .Values.podIdentity.principalArn }}
  roleARN: {{ .Values.podIdentity.roleArn }}
  type: ECRPullThroughCache
{{- end }}
