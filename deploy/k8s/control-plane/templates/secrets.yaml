apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-secrets
  namespace: {{ .Release.Namespace | default "default" }}
  labels:
    app.kubernetes.io/name: agentgrid-control-plane
    app.kubernetes.io/instance: {{ .Release.Name }}
type: Opaque
stringData:
  # Control plane API key (for node authentication)
  CONTROL_PLANE_API_KEY: {{ default "change-me-in-production" | b64enc | quote }}
  
  # JWT secret for session tokens
  JWT_SECRET: {{ default "use-proper-secret-in-production" | b64enc | quote }}
  
  {{- if and .Values.persistence.enabled .Values.externalDatabase.enabled }}
  POSTGRES_PASSWORD: {{ .Values.externalDatabase.passwordSecret.value | default "temporary-password" | b64enc | quote }}
  {{- end }}

---

# PostgreSQL database credentials (if using external DB)
{{- if .Values.externalDatabase.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.externalDatabase.passwordSecret.name }}
  namespace: {{ .Release.Namespace | default "default" }}
type: Opaque
stringData:
  password: {{ .Values.externalDatabase.passwordSecret.value | default "agentgrid-db-password" | b64enc | quote }}
{{- end }}

---

# S3 artifact storage credentials
{{- if eq .Values.artifacts.storageType "s3" }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.artifacts.s3.accessKeySecret.name }}
  namespace: {{ .Release.Namespace | default "default" }}
type: Opaque
stringData:
  access-key: {{ .Values.artifacts.s3.accessKeySecret.value | default "s3-access-key" | b64enc | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.artifacts.s3.secretKeySecret.name }}
  namespace: {{ .Release.Namespace | default "default" }}
type: Opaque
stringData:
  secret-key: {{ .Values.artifacts.s3.secretKeySecret.value | default "s3-secret-key" | b64enc | quote }}
{{- end }}

---

# Redis password
{{- if .Values.redis.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.redis.passwordSecret.name }}
  namespace: {{ .Release.Namespace | default "default" }}
type: Opaque
stringData:
  password: {{ .Values.redis.passwordSecret.value | default "redis-password" | b64enc | quote }}
{{- end }}
