apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-control-plane-config
  namespace: {{ .Release.Namespace | default "default" }}
  labels:
    app.kubernetes.io/name: agentgrid-control-plane
    app.kubernetes.io/instance: {{ .Release.Name }}
data:
  # Logging configuration
  LOG_LEVEL: {{ .Values.logging.level | quote }}
  LOG_FORMAT: {{ .Values.logging.format | quote }}
  
  # Database type selection
  {{- if .Values.externalDatabase.enabled }}
  DATABASE_TYPE: postgresql
  {{- else }}
  DATABASE_TYPE: sqlite
  SQLITE_PATH: /var/lib/agentgrid/data/agentgrid.db
  {{- end }}
  
  # Artifact storage
  ARTIFACTS_STORAGE_TYPE: {{ .Values.artifacts.storageType | quote }}
  {{- if eq .Values.artifacts.storageType "s3" }}
  ARTIFACTS_S3_BUCKET: {{ .Values.artifacts.s3.bucket | quote }}
  ARTIFACTS_S3_REGION: {{ .Values.artifacts.s3.region | quote }}
  {{- if .Values.artifacts.s3.endpoint }}
  ARTIFACTS_S3_ENDPOINT: {{ .Values.artifacts.s3.endpoint | quote }}
  {{- end }}
  {{- end }}
  
  # Redis cache (optional)
  {{- if .Values.redis.enabled }}
  CACHE_BACKEND: redis
  REDIS_HOST: {{ .Values.redis.host | quote }}
  REDIS_PORT: {{ .Values.redis.port | quote }}
  {{- else }}
  CACHE_BACKEND: memory
  {{- end }}
  
  # Rate limiting
  {{- if .Values.rateLimiting.enabled }}
  RATE_LIMIT_ENABLED: "true"
  RATE_LIMIT_RPS: {{ .Values.rateLimiting.requestsPerSecond | quote }}
  RATE_LIMIT_BURST: {{ .Values.rateLimiting.burstSize | quote }}
  {{- else }}
  RATE_LIMIT_ENABLED: "false"
  {{- end }}
  
  # Tracing
  {{- if .Values.tracing.enabled }}
  TRACING_ENABLED: "true"
  TRACING_ENDPOINT: {{ .Values.tracing.endpoint | quote }}
  TRACING_SAMPLE_RATE: {{ .Values.tracing.samplingRate | quote }}
  {{- else }}
  TRACING_ENABLED: "false"
  {{- end }}

---

# Node daemon configuration template
{{- range $i := until 5 }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-node-config-{{ $i }}
  namespace: {{ .Release.Namespace | default "default" }}
  labels:
    app.kubernetes.io/name: agentgrid-node
    agentgrid.node.id: "node-{{ $i }}"
data:
  NODE_ID: node-{{ $i }}
  CONTROL_PLANE_URL: http://{{ .Release.Name }}-control-plane:{{ .Values.service.port }}
  TRANSPORT_MODE: auto  # poll, ws, or auto
  MAX_ATTEMPTS_PER_TASK: "5"
  WORKTREE_BASE_PATH: /tmp/agentgrid-worktrees
---
{{- end }}
