# Default values for agentgrid-node
# Optimized for autoscaling worker nodes

replicaCount: 1

image:
  repository: openclaw/agentgrid-node-daemon
  tag: "0.4.0"
  pullPolicy: IfNotPresent

# Resource limits for agent sandboxes
resources:
  requests:
    cpu: "500m"
    memory: "1Gi"
  limits:
    cpu: "4"
    memory: "8Gi"

# Node identity
nodeId:
  prefix: "node"
  suffixLength: 6  # Random suffix for uniqueness

# Control plane connection
controlPlane:
  url: "http://agentgrid-control-plane:8080"
  apikeySecret:
    name: control-plane-secrets
    key: CONTROL_PLANE_API_KEY

# Transport mode: poll, ws, or auto
transport:
  mode: auto  # auto-detect best transport
  polling:
    intervalSeconds: 5
    timeoutSeconds: 30
  websocket:
    enabled: true
    reconnectDelaySeconds: 5
    maxReconnectDelaySeconds: 60

# Kubernetes-based autoscaling (KEDA)
keda:
  enabled: true
  minReplicas: 1
  maxReplicas: 100
  # Scale trigger metric: pending tasks per node
  scaleTargetMetricName: "agentgrid_pending_tasks"
  scaleTriggerThreshold: 5  # Scale up when >5 tasks pending per replica
  
# Podman container runtime for agent sandboxing
podman:
  enabled: true
  version: "4.5.0"
  isolationProfile: "restricted"  # restricted, strict, unconfined
  # Container resource limits for agents
  defaultAgentResources:
    cpu: "2"
    memory: "4Gi"
    ephemeralStorage: "10Gi"
  # Network policy for agents
  network:
    mode: bridge
    firewallEnabled: true

# Worktree management
worktrees:
  basePath: /tmp/agentgrid-worktrees
  maxConcurrent: 10
  evictionPolicy: leastRecentlyUsed
  maxSizePerTree: "5Gi"

# Task queue depth for KEDA metrics
taskQueue:
  metricPrefix: "agentgrid_queue_"
  batchSize: 10  # Tasks processed per fetch

# Adapter pool configuration
adapters:
  claude:
    enabled: true
    image: quay.io/openclaw/adapter-claude:0.4.0
    resources:
      cpu: "2"
      memory: "4Gi"
  codex:
    enabled: false
  opencode:
    enabled: false

# Logging
logging:
  level: info
  format: json

# Monitoring
metrics:
  enabled: true
  port: 9090

# Node affinity/tolerations for specialized hardware
nodeSelector: {}

tolerations: []

affinity: {}

# Startup timeout (for slow cluster boot)
startupTimeoutSeconds: 120

# Graceful shutdown
gracefulShutdown:
  enabled: true
  timeoutSeconds: 30
