apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Release.Name }}-node-cluster-role
rules:
  # Read tasks from control plane API
  - apiGroups: [""]
    resources: ["pods", "services", "configmaps"]
    verbs: ["get", "list", "watch"]
  
  # Manage agent sandbox containers (via Podman)
  - apiGroups: [""]
    resources: ["pods/eviction"]
    verbs: ["create"]
  
  # Metrics scraping
  - nonResourceURLs: ["/metrics"]
    verbs: ["get"]

---

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Release.Name }}-node-cluster-role-binding
subjects:
  - kind: ServiceAccount
    name: {{ .Release.Name }}-node
    namespace: {{ .Release.Namespace | default "default" }}
roleRef:
  kind: ClusterRole
  name: {{ .Release.Name }}-node-cluster-role
  apiGroup: rbac.authorization.k8s.io
