{{- if .Values.keda.enabled }}
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: {{ .Release.Name }}-node-scaler
  namespace: {{ .Release.Namespace | default "default" }}
  labels:
    app.kubernetes.io/name: agentgrid-node
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  scaleTargetRef:
    name: {{ .Release.Name }}-node
  minReplicaCount: {{ .Values.keda.minReplicas }}
  maxReplicaCount: {{ .Values.keda.maxReplicas }}
  triggers:
    - type: custom
      metadata:
        type: {{ .Values.keda.scaleTriggerMetricName }}
        authenticationRefs: ""
        # Queue depth metric from Prometheus adapter
        customMetricProvider:
          metricName: {{ .Values.taskQueue.metricPrefix }}pending_tasks
          threshold: {{ .Values.keda.scaleTriggerThreshold | quote }}
          scaler: agentgrid-scheduler
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Percent
          value: 100
          periodSeconds: 60
        - type: Pods
          value: 5
          periodSeconds: 60
      selectPolicy: Max
---
# Scale to zero support (optional)
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: {{ .Release.Name }}-scheduler-scaler
  namespace: {{ .Release.Namespace | default "default" }}
  labels:
    app.kubernetes.io/name: agentgrid-scheduler
spec:
  scaleTargetRef:
    name: {{ .Release.Name }}-scheduler
  minReplicaCount: 0
  maxReplicaCount: 2
  triggers:
    - type: apiServer
      metadata:
        resource: pending_task_count
        namespace: {{ .Release.Namespace | default "default" }}
        query: "SELECT COUNT(*) FROM pending_tasks WHERE scheduled_at < NOW()"
{{- end }}
