apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-node
  namespace: {{ .Release.Namespace | default "default" }}
  labels:
    app.kubernetes.io/name: agentgrid-node
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: http
      protocol: TCP
      name: http
    {{- if .Values.metrics.enabled }}
    - port: 9090
      targetPort: metrics
      protocol: TCP
      name: metrics
    {{- end }}
  selector:
    app.kubernetes.io/name: agentgrid-node
    app.kubernetes.io/instance: {{ .Release.Name }}
