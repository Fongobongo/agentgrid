apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-node-config
  namespace: {{ .Release.Namespace | default "default" }}
data:
  # Transport configuration
  TRANSPORT_MODE: {{ .Values.transport.mode | quote }}
  
  {{- if eq .Values.transport.mode "poll" }}
  POLL_INTERVAL_SECONDS: {{ .Values.transport.polling.intervalSeconds | quote }}
  POLL_TIMEOUT_SECONDS: {{ .Values.transport.polling.timeoutSeconds | quote }}
  {{- end }}
  
  # Worktree settings
  WORKTREES_BASE_PATH: {{ .Values.worktrees.basePath | quote }}
  MAX_CONCURRENT_WORKTREES: {{ .Values.worktrees.maxConcurrent | quote }}
  
  # Podman isolation profile
  PODMAN_ISOLATION_PROFILE: {{ .Values.podman.isolationProfile | quote }}
  
  # Default agent sandbox resources
  DEFAULT_AGENT_CPU: {{ .Values.podman.defaultAgentResources.cpu | quote }}
  DEFAULT_AGENT_MEMORY: {{ .Values.podman.defaultAgentResources.memory | quote }}
  DEFAULT_AGENT_STORAGE: {{ .Values.podman.defaultAgentResources.ephemeralStorage | quote }}
  
  # Adapter environment
  ADAPTER_POOL_CLAUDE_ENABLED: {{ .Values.adapters.claude.enabled | quote }}
  {{- if .Values.adapters.codex.enabled }}
  ADAPTER_POOL_CODEX_ENABLED: "true"
  {{- end }}
  {{- if .Values.adapters.opencode.enabled }}
  ADAPTER_POOL_OPENCODE_ENABLED: "true"
  {{- end }}
