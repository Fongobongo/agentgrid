apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-node
  namespace: {{ .Release.Namespace | default "default" }}
  labels:
    app.kubernetes.io/name: agentgrid-node
    app.kubernetes.io/instance: {{ .Release.Name }}
    version: {{ .Chart.AppVersion | quote }}
spec:
  {{- if not .Values.keda.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      app.kubernetes.io/name: agentgrid-node
      app.kubernetes.io/instance: {{ .Release.Name }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0  # Zero downtime scaling
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agentgrid-node
        app.kubernetes.io/instance: {{ .Release.Name }}
        version: {{ .Chart.AppVersion | quote }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      serviceAccountName: {{ .Release.Name }}-node
      containers:
        - name: node-daemon
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: metrics
              containerPort: 9090
              protocol: TCP
          env:
            - name: AGENTGRID_NODE_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: NODEDAEMON_BIND_ADDR
              value: "0.0.0.0:8080"
            - name: RUST_LOG
              value: {{ .Values.logging.level | quote }}
            - name: CONTROL_PLANE_URL
              value: {{ .Values.controlPlane.url | quote }}
            - name: TRANSPORT_MODE
              value: {{ .Values.transport.mode | quote }}
            {{- if eq .Values.transport.mode "poll" }}
            - name: POLL_INTERVAL_SECONDS
              value: {{ .Values.transport.polling.intervalSeconds | quote }}
            - name: POLL_TIMEOUT_SECONDS
              value: {{ .Values.transport.polling.timeoutSeconds | quote }}
            {{- end }}
            {{- if eq .Values.transport.mode "ws" }}
            - name: WS_RECONNECT_DELAY_SECONDS
              value: {{ .Values.transport.websocket.reconnectDelaySeconds | quote }}
            - name: WS_MAX_RECONNECT_DELAY_SECONDS
              value: {{ .Values.transport.websocket.maxReconnectDelaySeconds | quote }}
            {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
          volumeMounts:
            - name: worktrees
              mountPath: {{ .Values.worktrees.basePath }}
            - name: tmp
              mountPath: /tmp
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", {{ printf "sleep %d" .Values.gracefulShutdown.timeoutSeconds | quote }}]
      volumes:
        - name: worktrees
          emptyDir:
            sizeLimit: {{ .Values.worktrees.maxSizePerTree }}
        - name: tmp
          emptyDir: {}
      nodeSelector:
        {{- toYaml .Values.nodeSelector | nindent 8 }}
      tolerations:
        {{- toYaml .Values.tolerations | nindent 8 }}
      affinity:
        {{- toYaml .Values.affinity | nindent 8 }}

---

# Adapter pool sidecar containers (for each enabled adapter)
{{- range $adapter := .Values.adapters }}
{{- if $adapter.enabled }}
        - name: adapter-{{ $adapter.name }}
          image: {{ $adapter.image }}
          imagePullPolicy: IfNotPresent
          resources:
            requests:
              cpu: {{ $adapter.resources.cpu | quote }}
              memory: {{ $adapter.resources.memory | quote }}
            limits:
              cpu: {{ $adapter.resources.cpu | quote }}
              memory: {{ $adapter.resources.memory | quote }}
          volumeMounts:
            - name: worktrees
              mountPath: /worktrees
{{- end }}
{{- end }}
