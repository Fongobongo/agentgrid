# Egress firewall for restricted-mode sandboxes.
#
# Edit the domain allowlist below. Traffic to anything not listed — including
# RFC1918 LAN ranges — is denied, so a restricted agent reaches exactly the
# domains the operator signs off on and nothing else.
acl allowed_domains dstdomain .github.com
acl allowed_domains dstdomain .githubusercontent.com
acl allowed_domains dstdomain .pypi.org
acl allowed_domains dstdomain .pythonhosted.org
acl allowed_domains dstdomain .npmjs.org
acl allowed_domains dstdomain .crates.io
acl allowed_domains dstdomain .static.crates.io
acl allowed_domains dstdomain .rust-lang.org
acl allowed_domains dstdomain .anthropic.com
acl allowed_domains dstdomain .openai.com

# LAN destinations are denied explicitly, and the acl is `dst` on purpose.
# It used to be `src` (`acl localnet src 10.0.0.0/8` … with
# `http_access deny localnet`), which asks the opposite question: every sandbox
# on a docker network has a 172.16/12 *source* address, so that rule refused
# every request the proxy ever received. The file read as "allowlisted domains
# only" and behaved as "nothing at all".
#
# `dstdomain` above never matches an IP literal, so `deny !allowed_domains`
# covers LAN destinations too; the explicit rule is here to keep the intent
# legible and to survive a future allowlist that names an IP.
acl lan_dst dst 10.0.0.0/8
acl lan_dst dst 172.16.0.0/12
acl lan_dst dst 192.168.0.0/16
acl lan_dst dst fc00::/7
acl lan_dst dst fe80::/10

http_port 3128
http_access deny lan_dst
http_access deny !allowed_domains
http_access allow allowed_domains
http_access deny all

# Never cache agent traffic: responses must be fresh, and caching could leak
# one attempt's fetched content into another's.
cache deny all

# The sidecar runs as `proxy` (uid 13), which cannot open ICMP sockets, so the
# pinger aborts with "FATAL: Unable to open any ICMP sockets" on every start.
# It only measures round-trip time for cache peer selection, which is
# irrelevant here: nothing is cached and there is no hierarchy. Off is the
# honest fix — the alternative is a FATAL in the log on every boot.
pinger_enable off

access_log stdio:/dev/stdout
cache_log none
shutdown_lifetime 2 seconds
