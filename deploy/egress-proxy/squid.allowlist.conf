# Competitor-gap feature: egress firewall for restricted-mode sandboxes.
# Edit the domain allowlist below. Traffic to anything not listed — including
# RFC1918 LAN ranges — is denied, so a restricted agent reaches exactly the
# domains the operator signs off on and nothing else.
acl allowed_domains dstdomain .github.com
acl allowed_domains dstdomain .githubusercontent.com
acl allowed_domains dstdomain .pypi.org
acl allowed_domains dstdomain .pythonhosted.org
acl allowed_domains dstdomain .npmjs.org
acl allowed_domains dstdomain .crates.io
acl allowed_domains dstdomain .static.crates.io
acl allowed_domains dstdomain .rust-lang.org
acl allowed_domains dstdomain .anthropic.com
acl allowed_domains dstdomain .openai.com

acl localnet src 0.0.0.1-0.255.255.255
acl localnet src 10.0.0.0/8
acl localnet src 172.16.0.0/12
acl localnet src 192.168.0.0/16
acl localnet src fc00::/7
acl localnet src fe80::/10

http_port 3128
http_access deny !allowed_domains
http_access deny localnet
http_access allow allowed_domains
http_access deny all

# Never cache agent traffic: responses must be fresh, and caching could leak
# one attempt's fetched content into another's.
cache deny all

access_log stdio:/dev/stdout
cache_log none
shutdown_lifetime 2 seconds
