# Egress firewall for restricted-mode sandboxes.
#
# A squid sidecar that enforces a domain allowlist for agent traffic. Docker
# has no native per-domain/per-CIDR egress filter, so the node daemon
# collapses `network_mode=restricted` to `--network none` by default. Wiring
# this sidecar gives "internet but allowlisted domains only" back:
#
#   - the node daemon attaches restricted attempts to the `agentgrid-egress`
#     docker network and injects HTTP_PROXY/HTTPS_PROXY/ALL_PROXY
#     (AGENTGRID_SANDBOX_EGRESS_NETWORK + AGENTGRID_SANDBOX_EGRESS_PROXY)
#   - squid permits only the allowlisted domains and blocks every other
#     destination, including RFC1918 LAN ranges (the whole point of
#     "restricted": internet OK, LAN off-limits)
#
# Two networks, and the split is the whole guarantee. `agentgrid-egress` is
# `internal: true`, so a sandbox on it has exactly one reachable peer — this
# sidecar — and no route anywhere else; a process that ignores HTTP_PROXY and
# opens a raw socket gets ENETUNREACH. The sidecar is the only member of
# `agentgrid-egress-outbound`, which is what gives it a default route. With a
# single non-internal network (the previous shape) the sandbox had NAT of its
# own and the proxy env was advisory: the allowlist existed, the enforcement
# did not.
#
# Usage:
#   docker compose -f deploy/egress-proxy/docker-compose.yml up -d
#   AGENTGRID_SANDBOX_EGRESS_NETWORK=agentgrid-egress \
#   AGENTGRID_SANDBOX_EGRESS_PROXY=http://egress-proxy:3128 \
#     agentgrid-node-daemon
#
# Edit deploy/egress-proxy/squid.allowlist.conf to allow your domains.
services:
  egress-proxy:
    image: ubuntu/squid:6.6-24.04_edge@sha256:8a3baed477e2c282ab8aa5edad442f69873246964f225c5c2ae8364b6610963c
    restart: unless-stopped
    # Run as `proxy` (uid 13) instead of root. Not cosmetic: the image starts
    # squid as root and squid then drops to `cache_effective_user proxy`, which
    # needs CAP_SETUID/CAP_SETGID — and `cap_drop: ALL` below removes them, so
    # the drop fails, squid exits, and the proxy never listens (the symptom is
    # a curl `000` through the proxy, which reads like a network problem).
    # Being the target user already means there is no drop to perform. This is
    # what the distro's own unit does (`User=proxy` in squid.service).
    user: "13:13"
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,nodev
      # Squid's own dirs. `/var/log/squid` is a VOLUME in the image (root-owned,
      # 0755) and uid 13 cannot write it, so it becomes a tmpfs too — the
      # access log goes to stdout anyway, this is only so nothing fails to open.
      - /var/log/squid:mode=0777
      - /var/spool/squid:mode=0777
      - /var/run:mode=0777
      - /var/cache/squid:mode=0777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    volumes:
      - ./squid.allowlist.conf:/etc/squid/squid.conf:ro
    networks:
      - egress
      - outbound
    expose:
      - "3128"

networks:
  # Sandboxes and the sidecar. No route to anywhere else.
  egress:
    name: agentgrid-egress
    internal: true
  # The sidecar's own way out. Nothing else joins this one.
  outbound:
    name: agentgrid-egress-outbound
    internal: false
