name: Release

# Build static release binaries for every supported target. Runs on version
# tags (v*) and manually. x86_64 + aarch64 musl are the primary artifacts;
# x86_64-gnu is the fallback (AGENTS.md release-target matrix).
#
# musl targets cross-compile via `cross` (prebuilt Docker toolchains on
# ghcr.io — reliable, no external zig download). The gnu target builds natively.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            cross: true
          - target: aarch64-unknown-linux-musl
            cross: true
          - target: x86_64-unknown-linux-gnu
            cross: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          targets: ${{ matrix.target }}

      - name: install cross (musl cross-compile)
        if: matrix.cross
        run: cargo install cross --locked

      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae

      - name: test before release (host target)
        # Hardening P2 item 30: never ship binaries from a tree that does not
        # pass the workspace test suite. Run on the host target (not the cross
        # target) so we exercise the real test code, not a cross-compile.
        run: cargo test --workspace

      - name: build web UI
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: build release binaries
        run: |
          if [ "${{ matrix.cross }}" = "true" ]; then
            cross build --release --target ${{ matrix.target }} \
              -p agentgrid-control-plane -p agentgrid-cli \
              -p agentgrid-node-daemon -p agentgrid-adapters \
              -p agentgrid-gateway -p agentgrid-acp
          else
            cargo build --release --target ${{ matrix.target }} \
              -p agentgrid-control-plane -p agentgrid-cli \
              -p agentgrid-node-daemon -p agentgrid-adapters \
              -p agentgrid-gateway -p agentgrid-acp
          fi

      - name: binary size guardrail
        run: |
          find "target/${{ matrix.target }}/release" -maxdepth 1 -type f -executable -print0 \
            | xargs -0 du -h
          # Fail if any binary exceeds 60 MiB (catches regression bloat).
          find "target/${{ matrix.target }}/release" -maxdepth 1 -type f -executable -print0 \
            | xargs -0 -I{} sh -c 'test "$(stat -c%s "{}")" -le 62914560'

      - name: smoke test (binaries start)
        # Hardening P2 item 30: every published binary must at least start and
        # report a version (musl binaries run on the ubuntu host; no dynamic
        # libs needed). Catches a broken build before the release is cut.
        # adapter-mock has no --version (it starts as an agent) — skipped.
        run: |
          cd "target/${{ matrix.target }}/release"
          ./ag --version
          ./agentgrid-control-plane --version
          ./agentgrid-node-daemon --version
          ./agentgrid-gateway --version
          ./agentgrid-acp-agent --version
          ./adapter-claude --version
          ./adapter-opencode --version

      - name: checksums (SHA256SUMS)
        run: |
          cd "target/${{ matrix.target }}/release"
          sha256sum agentgrid-control-plane ag agentgrid-node-daemon agentgrid-gateway agentgrid-acp-agent adapter-mock adapter-claude adapter-opencode \
            > SHA256SUMS
          cat SHA256SUMS

      - name: upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: agentgrid-${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/release/agentgrid-control-plane
            target/${{ matrix.target }}/release/ag
            target/${{ matrix.target }}/release/agentgrid-node-daemon
            target/${{ matrix.target }}/release/agentgrid-gateway
            target/${{ matrix.target }}/release/agentgrid-acp-agent
            target/${{ matrix.target }}/release/adapter-mock
            target/${{ matrix.target }}/release/adapter-claude
            target/${{ matrix.target }}/release/adapter-opencode
            target/${{ matrix.target }}/release/SHA256SUMS
            web/dist
          if-no-files-found: warn

  node-image:
    # Plan 733: publish the base node-daemon image to GHCR on version tags so
    # operators pull a pinned, signed image instead of building locally. The
    # image is multi-arch (amd64 + arm64) and carries the release version tag
    # (vX.Y.Z) plus the major/minor tags for convenient pinning.
    name: publish node-daemon base image
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: set up buildx
        uses: docker/setup-buildx-action@6524bf65af31da8d45b59e8c27de4bd072b392f5
      - name: log in to GHCR
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: derive image tags
        id: meta
        run: |
          v=${GITHUB_REF_NAME#v}
          echo "tags=ghcr.io/${{ github.repository_owner }}/agentgrid-node-daemon:${GITHUB_REF_NAME},ghcr.io/${{ github.repository_owner }}/agentgrid-node-daemon:${v%.*},ghcr.io/${{ github.repository_owner }}/agentgrid-node-daemon:latest" >> "$GITHUB_OUTPUT"
      - name: build and push (amd64 + arm64)
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        with:
          context: .
          file: Dockerfile.node-daemon
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: attest image provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/agentgrid-node-daemon
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  release:
    # Hardening P2 item 30: publish a GitHub Release for the tag, attaching
    # all per-target artifacts + their SHA256SUMS so an operator can verify
    # checksums of every downloaded binary.
    name: publish GitHub Release
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          path: artifacts
      - name: flatten artifacts
        run: |
          mkdir -p release-assets
          find artifacts -type f \
            \( -name 'agentgrid-control-plane' -o -name 'ag' \
               -o -name 'agentgrid-node-daemon' -o -name 'agentgrid-gateway' \
               -o -name 'agentgrid-acp-agent' -o -name 'adapter-mock' \
               -o -name 'adapter-claude' -o -name 'adapter-opencode' -o -name 'SHA256SUMS' \) \
            -exec cp {} release-assets/ \;
          # Namespace SHA256SUMS per target to avoid collisions.
          find artifacts -name 'SHA256SUMS' -exec sh -c 'd=$(dirname {}); t=$(basename $d | sed "s/agentgrid-//"); cp {} release-assets/SHA256SUMS.$t' \;
          ls -la release-assets
      - name: attest build provenance
        # Hardening P2 item 29: GitHub provenance attestation for every release
        # artifact — a verifiable record of who built what, from which commit.
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be
        with:
          subject-path: 'release-assets/*'
      - name: generate SBOM (CycloneDX)
        # Plan 964: the release itself must ship the dependency SBOM, not just
        # a build artifact in CI. CycloneDX JSON of the Rust workspace.
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610
        with:
          path: .
          format: cyclonedx-json
          artifact-name: sbom.cyclonedx.json
          output-file: release-assets/sbom.cyclonedx.json
      - name: install cosign
        # Hardening P2 item 29: keyless cosign signature over the per-target
        # SHA256SUMS so consumers can verify artifact integrity independently.
        uses: sigstore/cosign-installer@d58896d6a1865668819e1d91763c7751a165e159
      - name: sign checksums (keyless cosign)
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          for f in release-assets/SHA256SUMS.*; do
            cosign sign-blob --yes "$f" --output-signature "$f.sig"
          done
      - name: create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Attach the CHANGELOG section for the tag being released (falling
          # back to [Unreleased]) as the release body so the GitHub Release
          # page mirrors the changelog instead of only the auto-generated
          # commit/PR notes.
          set -e
          notes=release-assets/RELEASE_NOTES.md
          awk -v tag="${GITHUB_REF_NAME}" '
            $0 == "## [" tag "]" { in_sec=1; next }
            /^## \[/ { in_sec=0 }
            in_sec { print }
          ' CHANGELOG.md > "$notes"
          if [ ! -s "$notes" ]; then
            awk '
              /^## \[Unreleased\]/ { in_un=1; next }
              /^## \[/ { in_un=0 }
              in_un { print }
            ' CHANGELOG.md > "$notes"
          fi
          if [ ! -s "$notes" ]; then
            echo "_No changelog entries for ${GITHUB_REF_NAME}._" > "$notes"
          fi
          gh release create "${GITHUB_REF_NAME}" release-assets/* \
            --title "${GITHUB_REF_NAME}" \
            --notes-file "$notes"
