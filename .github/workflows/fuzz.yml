name: fuzz

# Audit phase C follow-up: the fuzz/ crate targets only ever ran when someone
# invoked them manually. Short scheduled sessions accumulate parser coverage
# over time and catch regressions in the untrusted-input parsers
# (PolicyVerdict JSON, workflow template YAML, handoff package JSON) without
# gating merges on flaky fuzz findings.
on:
  schedule:
    - cron: "40 4 * * *"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        target:
          - policy_verdict_json
          - workflow_template_yaml
          - handoff_package_json
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      # cargo-fuzz builds with -Zsanitizer=-Zbuild-std, which requires the
      # nightly toolchain plus the rust-src component.
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: nightly
          components: rust-src
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae
        with:
          # The fuzz crate is its own workspace (excluded from the stable
          # workspace), so cache its target dir separately.
          workspaces: fuzz
      - name: install cargo-fuzz
        run: cargo +nightly install cargo-fuzz --locked
      - name: fuzz ${{ matrix.target }}
        working-directory: fuzz
        run: cargo +nightly fuzz run ${{ matrix.target }} -- -max_total_time=300
      - name: upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: crash-${{ matrix.target }}
          path: fuzz/artifacts/${{ matrix.target }}/
          if-no-files-found: ignore
