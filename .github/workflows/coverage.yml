name: coverage

# Hardening P2 item 28: code-coverage trend. Runs `cargo llvm-cov` over the
# workspace unit/integration tests and uploads the lcov report as a build
# artifact. Not on every PR (too slow); weekly + manual dispatch so the trend
# is tracked without gating merges.
on:
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae
      - name: install cargo-llvm-cov
        run: cargo install cargo-llvm-cov --locked
      - name: generate coverage
        run: cargo llvm-cov --workspace --lcov --output-path lcov.info
      - name: upload report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: lcov.info
          path: lcov.info
          if-no-files-found: error
