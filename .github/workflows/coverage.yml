name: coverage

# Hardening P2 item 28: code-coverage trend. Runs `cargo llvm-cov` over the
# workspace unit/integration tests and uploads the lcov report as a build
# artifact. Not on every PR (too slow); weekly + manual dispatch so the trend
# is tracked without gating merges.
on:
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - name: install cargo-llvm-cov
        run: cargo install cargo-llvm-cov --locked
      - name: generate coverage
        run: cargo llvm-cov --workspace --lcov --output-path lcov.info
      - name: upload report
        uses: actions/upload-artifact@v4
        with:
          name: lcov.info
          path: lcov.info
          if-no-files-found: error
