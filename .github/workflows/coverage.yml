name: coverage

# Hardening P2 item 28: code-coverage trend. Runs `cargo llvm-cov` over the
# workspace unit/integration tests and uploads the lcov report as a build
# artifact. Not on every PR (too slow); weekly + manual dispatch so the trend
# is tracked without gating merges.
on:
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
      # llvm-tools must land on the pinned toolchain (rust-toolchain.toml,
      # profile=minimal), not the action's default — same trap that broke
      # ci.yml's fmt step.
      - name: add llvm-tools to the pinned toolchain
        run: |
          tc=$(grep -oP '(?<=channel = ")[^"]+' rust-toolchain.toml)
          rustup component add llvm-tools-preview --toolchain "$tc"
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae
      - name: install cargo-llvm-cov
        run: cargo install cargo-llvm-cov --locked
      - name: generate coverage
        run: cargo llvm-cov --workspace --lcov --output-path lcov.info
      - name: upload report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: lcov.info
          path: lcov.info
          if-no-files-found: error
