name: audit-debug

# One-shot diagnostic: plain-text `cargo audit` output (the audit-check
# action only surfaces a SARIF blob, which hides the failing advisory).
on:
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
      - name: install cargo-audit
        run: cargo install cargo-audit --locked
      - name: cargo audit (plain output)
        run: cargo audit --deny warnings 2>&1 | tee audit.txt || true
      - name: show summary
        if: always()
        run: |
          echo "===== advisory listing ====="
          grep -E "Crate:|Version:|ID:|Title:|Solution:|Severity:" audit.txt || true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: audit.txt
          path: audit.txt
          if-no-files-found: ignore
