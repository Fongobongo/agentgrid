# Hardening P2 item 29: CodeQL static analysis (Rust + JS) on PRs and nightly.
# Actions are SHA-pinned (Dependabot bumps the SHAs weekly).
name: CodeQL

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: CodeQL analyze
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        language: ["rust", "javascript-typescript"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: initialize CodeQL
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938
        with:
          languages: ${{ matrix.language }}
      - name: install rust toolchain (rust analysis only)
        if: matrix.language == 'rust'
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
      - name: build (rust analysis only)
        if: matrix.language == 'rust'
        run: cargo build --workspace
      - name: perform CodeQL analysis
        uses: github/codeql-action/analyze@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28
        with:
          category: "/language:${{ matrix.language }}"
