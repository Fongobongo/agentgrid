name: PR Validation

on:
  pull_request:
    branches: [main, master]
    paths:
      - 'crates/**'
      - '.github/workflows/**'

permissions:
  contents: read

# Supply-chain parity with ci.yml / supply-chain.yml: every third-party
# action pinned by commit SHA (no moving tags, never @master).
jobs:
  format-check:
    name: Format Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
      # Components must land on the pinned toolchain (rust-toolchain.toml,
      # profile=minimal) — the action's `components:` input targets its
      # default toolchain, leaving `cargo fmt` uninstalled on the pin.
      - name: Add rustfmt to the pinned toolchain
        run: |
          tc=$(grep -oP '(?<=channel = ")[^"]+' rust-toolchain.toml)
          rustup component add rustfmt --toolchain "$tc"

      - name: Check formatting
        run: cargo fmt --check

  clippy:
    name: Clippy Lints
    runs-on: ubuntu-latest
    env:
      CARGO_INCREMENTAL: 0
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev protobuf-compiler

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
      - name: Add clippy to the pinned toolchain
        run: |
          tc=$(grep -oP '(?<=channel = ")[^"]+' rust-toolchain.toml)
          rustup component add clippy --toolchain "$tc"

      - name: Run clippy
        run: |
          cargo clippy --all-targets --all-features -- -D warnings

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    env:
      CARGO_INCREMENTAL: 0
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libsqlite3-dev protobuf-compiler

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4

      - name: Run tests
        run: cargo test --workspace --lib

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    env:
      CARGO_INCREMENTAL: 0
    # No postgres service: the control plane bundles SQLite (sqlx "sqlite"
    # feature); nothing in the workspace reads DATABASE_URL — the service
    # container was dead weight from an early template.
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libsqlite3-dev protobuf-compiler

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4

      - name: Run integration tests
        run: cargo test --workspace --tests -- --test-threads=1

  docker-build:
    name: Docker Build (No Push)
    runs-on: ubuntu-latest
    needs: [unit-tests]
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069

      - name: Build control plane image
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25
        with:
          context: .
          file: ./Dockerfile.control-plane-musl
          platforms: linux/amd64
          push: false
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build node daemon image
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25
        with:
          context: .
          # Dockerfile.node-daemon-musl was never committed; the regular
          # node-daemon Dockerfile builds fine without push.
          file: ./Dockerfile.node-daemon
          platforms: linux/amd64
          push: false
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

  security-scan:
    name: Security Scanning
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938
        with:
          sarif_file: 'trivy-results.sarif'
