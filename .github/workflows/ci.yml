name: CI

on:
  push:
    branches: [master]
  pull_request:
  # Nightly gate: the same jobs re-run on a schedule so a flaky/new failure
  # surfaces even on a quiet master, matching the hardening plan's
  # "Nightly" release gates.
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: fmt / clippy / test / build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae
      - name: format check
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --all-targets -- -D warnings
      # Plan 0.2 item 0.6 originally added `-- --report-time` to surface the
      # slowest tests, but that flag is nightly-only (-Z unstable-options) and
      # fails the whole step on the stable toolchain above. Dropped; per-test
      # timing can be reintroduced under a nightly job if needed.
      - name: test
        run: cargo test --workspace
      - name: build
        run: cargo build --workspace
      # Plan 1.9 (#17): workflows are code — validate every committed
      # `.agentgrid/workflows/*.yaml` against the strict schema + DAG.
      # Locally-built `ag workflow validate` needs no server.
      - name: validate agentgrid workflow yaml
        run: |
          set -euo pipefail
          if ls .agentgrid/workflows/*.yaml >/dev/null 2>&1; then
            for f in .agentgrid/workflows/*.yaml; do
              target/debug/ag workflow validate "$f"
            done
          else
            echo "no .agentgrid/workflows/*.yaml files to validate"
          fi

  web:
    name: web build / lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run lint

  docker-images:
    # Plan 0.3 item: CI builds every published Docker image so a broken
    # Dockerfile/layer fails the PR, not the release. Publish (GHCR push)
    # stays in release.yml — this is build-only, no registry credentials.
    name: docker images (build only)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae
      - name: build web UI (embedded into the control-plane image)
        working-directory: web
        run: |
          npm ci
          npm run build
      - name: build control-plane (glibc)
        run: docker build -f Dockerfile.control-plane -t ag-cp:ci .
      - name: build control-plane (musl/scratch)
        run: docker build -f Dockerfile.control-plane-musl -t ag-cp-musl:ci .
      - name: build node-daemon
        run: docker build -f Dockerfile.node-daemon -t ag-node:ci .
      - name: image liveness smoke (health/ready + version)
        run: |
          set -euo pipefail
          cid=$(docker run -d --rm -p 127.0.0.1:7890:7800 \
            -e AGENTGRID_LISTEN=0.0.0.0:7800 \
            -e AGENTGRID_DB=/tmp/cp.db \
            ag-cp:ci)
          trap 'docker rm -f "$cid" >/dev/null 2>&1 || true' EXIT
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:7890/health/ready && break
            sleep 1
          done
          curl -sf http://127.0.0.1:7890/health/ready
          curl -sf http://127.0.0.1:7890/v1/version | grep -q control_plane

  tier1-matrix:
    # Plan 0.3 / 6.13 item: Tier 1 CI beyond ubuntu-latest — the musl
    # binaries run on Debian 12/13 (glibc-independent) and Ubuntu 24.04.
    # Cheapest honest matrix: release-style musl build (x86_64) + a
    # run-the-binary smoke inside each distro container, nightly + manual
    # (a full musl cross build per PR would double the CI time).
    name: tier1 musl smoke (${{ matrix.distro }})
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        distro: ["debian:12", "debian:13", "ubuntu:24.04"]
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          targets: x86_64-unknown-linux-musl
      - name: install cross
        run: cargo install cross --locked
      - name: build musl binaries
        run: |
          cross build --release --target x86_64-unknown-linux-musl \
            -p agentgrid-control-plane -p agentgrid-cli \
            -p agentgrid-node-daemon -p agentgrid-adapters \
            -p agentgrid-gateway -p agentgrid-acp
      - name: smoke: binaries start in ${{ matrix.distro }}
        run: |
          set -euo pipefail
          distro="${{ matrix.distro }}"
          docker pull "$distro"
          for b in agentgrid-control-plane ag agentgrid-node-daemon agentgrid-gateway agentgrid-acp-agent adapter-claude adapter-codex adapter-aider adapter-pi adapter-opencode; do
            docker run --rm -v "$PWD/target/x86_64-unknown-linux-musl/release:/bins:ro" "$distro" \
              sh -c "/bins/$b --version"
          done
      - name: smoke: CP serves /health/ready inside ${{ matrix.distro }}
        run: |
          set -euo pipefail
          distro="${{ matrix.distro }}"
          docker run -d --name ag-tier1 -v "$PWD/target/x86_64-unknown-linux-musl/release:/bins:ro" \
            -p 127.0.0.1:7891:7800 "$distro" \
            sh -c "AGENTGRID_LISTEN=0.0.0.0:7800 AGENTGRID_DB=/tmp/cp.db /bins/agentgrid-control-plane"
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:7891/health/ready && break
            sleep 1
          done
          curl -sf http://127.0.0.1:7891/health/ready
          docker rm -f ag-tier1

  arm64-musl-smoke:
    # Plan 6.13/6.14 item: the aarch64-musl binary is published but never
    # smoke-tested. QEMU-emulated Debian arm64 proves the release binary at
    # least starts and reports a version. Uses setup-qemu-action pinned to
    # the same major as the buildx action in release.yml (v3 line). Nightly
    # + manual so a QEMU flake never blocks a PR.
    name: aarch64 musl smoke (QEMU)
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          targets: aarch64-unknown-linux-musl
      - name: install cross
        run: cargo install cross --locked
      - name: build aarch64 musl binaries
        run: |
          cross build --release --target aarch64-unknown-linux-musl \
            -p agentgrid-control-plane -p agentgrid-node-daemon -p agentgrid-cli
      - name: set up QEMU
        uses: docker/setup-qemu-action@4574d27a4764455b42196d70a065bc6853246a25  # v3.4.0
      - name: smoke: aarch64 binaries start under QEMU
        run: |
          set -euo pipefail
          docker run --rm --platform linux/arm64 \
            -v "$PWD/target/aarch64-unknown-linux-musl/release:/bins:ro" \
            debian:13 sh -c '/bins/agentgrid-control-plane --version && /bins/ag --version && /bins/agentgrid-node-daemon --version'


  e2e-failinject:
    name: e2e failure injection (process, no Docker)
    runs-on: ubuntu-latest
    needs: [rust]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae
      - name: build debug binaries
        run: cargo build --workspace
      - name: outbox durability (kill -9, CP outage, lost/retry)
        run: bash tests/e2e/run-outbox.sh
      - name: CP restart under load
        run: bash tests/e2e/run-cp-restart.sh
      - name: node disk-full fail-closed (spool limit)
        run: bash tests/e2e/run-disk-full.sh
        # Hardening P2 item 28: slow-network failure injection runs on every
        # build here (and via the schedule trigger above, nightly) since it is
        # process-based and quick.
      - name: slow-network failure injection
        run: bash tests/e2e/run-slow-net.sh
      - name: graceful drain (in-flight finishes, new stays queued)
        run: bash tests/e2e/run-drain.sh
      - name: RSS budgets (CP ≤64, node idle ≤25, streaming ≤60 MiB)
        run: bash tests/e2e/run-rss-budget.sh
      # Plan 1.11 (#8): SDK round-trip — CP + mock node + Python SDK
      # (run/wait/artifacts/cancel). Same process-based, no-Docker class.
      - name: SDK round-trip
        run: bash tests/e2e/run-sdk.sh
      - name: backup/restore rehearsal
        run: bash tests/e2e/run-restore.sh
      # Telegram gateway vs a mock Bot API: approvals listing + inline
      # keyboard + deny callback (process-based, no Docker, no real Telegram).
      - name: telegram gateway (mock Bot API)
        run: bash tests/e2e/run-telegram-gateway.sh
      # NOTE (bucket placement): run-auto-retry.sh and
      # run-review-consensus.sh live in the `e2e` compose job — they bring
      # up docker-compose, not bare processes.

  e2e:
    name: e2e (compose + 2 nodes + mock)
    runs-on: ubuntu-latest
    needs: [rust, web]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae
      - name: bring up stack and run a task
        run: bash tests/e2e/run.sh
        # Nightly-only (and manual): the workflow E2E brings up its own
        # compose stack and exercises a multi-role DAG across two nodes —
        # heavier than the per-PR smoke, so it runs only on schedule.
      - name: workflow E2E (multi-role DAG across two nodes)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: bash tests/e2e/run-workflow.sh
      - name: auto-retry + consensus (compose stack already up)
        run: |
          bash tests/e2e/run-auto-retry.sh
          bash tests/e2e/run-review-consensus.sh
      # Plan 2.4 follow-up: prove the read-only verifier worktree mount
      # actually blocks a write (kernel-semantics test), not just that the
      # docker args contain `:ro`. Runs once `run.sh` has built `ag-node:test`
      # and uses the agentgrid entrypoint-override to drop into `sh`.
      - name: verifier read-only write→EPERM (docker unit test)
        run: |
          cargo test -p agentgrid-node-daemon sandbox::tests::docker_ro_mount_really_blocks_write -- --nocapture
        env:
          AG_RUST_TEST_DOCKER: "1"
          AGENTGRID_SANDBOX_IMAGE: ag-node:test
      # Review follow-up (v0.3.9): boot the built images and verify liveness
      # end to end — musl control-plane (FROM scratch) must serve /health/ready
      # + a task-API round trip on a real volume; glibc images must reach
      # docker Health=healthy. Catches the v0.3.7 bug class (HEALTHCHECK that
      # could never succeed in its own image) at CI time, not in production.
      - name: image smoke (musl scratch cp + glibc HEALTHCHECK)
        run: bash tests/e2e/run-image-smoke.sh
        timeout-minutes: 15
      # Stage 12 / ADR 0003: the memory-limit acceptance — a sandboxed attempt
      # that exceeds --memory is OOM-killed by the runtime and completes with
      # error_code=resource_limit (not agent_failed). Uses the ag-node:test
      # image (built above by run.sh) so the mock adapter exists in-container.
      # Process-based CP+node binaries (target/debug) are built here because
      # this job otherwise only builds the compose images.
      - name: memory limit → OOM → resource_limit error code
        run: |
          cargo build --workspace -p agentgrid-control-plane -p agentgrid-node-daemon -p agentgrid-adapters
          bash tests/e2e/run-oom-limit.sh
        timeout-minutes: 15
        env:
          AGENTGRID_SANDBOX_IMAGE: ag-node:test
      # Plan 4.4 exit criterion: the same happy-path scenario (run →
      # logs → succeeded → artifact, cancel → retry) driven through both
      # the `ag` CLI binary and the exact HTTP sequence the React web UI
      # uses (web/src/api.ts). Process-based (no docker); a headless
      # browser stays out of scope — the UI is a thin client over these
      # endpoints, so the UI-consumed contract proves the UI can drive it.
      - name: CLI + web-UI contract parity
        run: |
          cargo build --workspace -p agentgrid-control-plane -p agentgrid-node-daemon -p agentgrid-adapters -p agentgrid-cli
          bash tests/e2e/run-ui-cli-parity.sh
        timeout-minutes: 15
      # Plan 6.11: the systemd transient-scope acceptance — a scoped attempt
      # hits MemoryMax (kernel OOM → resource_limit error code) and TasksMax
      # (fork refusal → failed), without any container runtime. GitHub's
      # ubuntu runners have no systemd user manager for the runner user, so
      # the script's own gate skips it there; it runs for real on any
      # systemd host (manual, nightly self-hosted, dev box).
      - name: systemd scope → cgroup limits (skips without a user manager)
        run: |
          cargo build --workspace -p agentgrid-control-plane -p agentgrid-node-daemon -p agentgrid-adapters
          bash tests/e2e/run-scope-limit.sh
        timeout-minutes: 15

  skill-bundle:
    name: skill bundle materializes identically local vs remote
    runs-on: ubuntu-latest
    # Hardening P2 item 28: needs AG_REMOTE_* in repo secrets (.env is
    # gitignored). exit 77 = "no remote configured" → treated as skip so CI
    # without a spare box stays green; runs nightly + manually.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: materialize skill bundle on local + remote and compare hashes
        env:
          AG_REMOTE_HOST: ${{ secrets.AG_REMOTE_HOST }}
          AG_REMOTE_USER: ${{ secrets.AG_REMOTE_USER }}
          AG_REMOTE_PASS: ${{ secrets.AG_REMOTE_PASS }}
          # Key auth preferred (run-two-host.sh uses AG_REMOTE_KEY when set);
          # the password path is the legacy fallback in tests/e2e/remote-ssh.py.
          AG_REMOTE_PORT: ${{ secrets.AG_REMOTE_PORT }}
          AG_REMOTE_SSH_KEY: ${{ secrets.AG_REMOTE_SSH_KEY }}
        run: |
          # The step shell is bash -e: a bare `bash script` that exits 77 kills
          # the step before the rc check below can turn it into a skip. Guard
          # with `|| rc=$?` so errexit never fires on the script's exit code.
          rc=0
          pip install --quiet paramiko 2>/dev/null || pip install --quiet --break-system-packages paramiko
          if [ -n "$AG_REMOTE_SSH_KEY" ]; then
            mkdir -p "$HOME/.ssh" && chmod 700 "$HOME/.ssh"
            printf '%s\n' "$AG_REMOTE_SSH_KEY" > "$HOME/.ssh/id_ed25519_agentgrid_remote"
            chmod 600 "$HOME/.ssh/id_ed25519_agentgrid_remote"
          fi
          cat > .env <<EOF
          AG_REMOTE_HOST=$AG_REMOTE_HOST
          AG_REMOTE_USER=$AG_REMOTE_USER
          AG_REMOTE_PASSWORD=$AG_REMOTE_PASS
          AG_REMOTE_PORT=${AG_REMOTE_PORT:-22}
          AG_REMOTE_KEY=$HOME/.ssh/id_ed25519_agentgrid_remote
          EOF
          bash tests/e2e/run-skill-bundle.sh || rc=$?
          if [ "$rc" = "77" ]; then
            echo "no AG_REMOTE_* configured — skipping skill-bundle job"
            exit 0
          fi
          exit "$rc"

  stress:
    name: race/concurrency stress (high parallelism, repeat)
    runs-on: ubuntu-latest
    # Hardening P2 item 28: churn runware tests at 16-way parallelism across
    # repeated invocations to surface races (double-assign, lease/ACK drift,
    # outbox seq race) that a single deterministic pass hides. Nightly + manual.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    # Measured: ~2.5 min build + 3 x ~10.5 min iterations = ~34 min.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          # Use a cheap shallow-ish fetch; conservative to not break cargo.
          submodules: false
      - name: install rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae
      - name: build tests once
        run: cargo test --workspace --no-run --locked
      - name: run workspace tests x3 at high parallelism
        env:
          # Full 100-iteration ack/lease race gate lives in the nightly stress
          # job; per-PR runs use the quick default (10).
          AGENTGRID_RACE_ITERS: "100"
        run: |
          for i in 1 2 3; do
            echo "::group::stress iteration $i"
            RUST_TEST_THREADS=16 cargo test --workspace -- --test-threads=16
            echo "::endgroup::"
          done

  miri:
    name: Miri (UB check on pure-Rust crates)
    runs-on: ubuntu-latest
    # Hardening P2 item 28: Miri catches undefined behavior in the state
    # machine and DTO layers (the unsafe-free core). Only `agentgrid-common`
    # is run — the tokio/sqlx crates do not support Miri. Nightly + manual.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: install nightly + miri
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: nightly
          components: miri
      - name: miri test common
        # MIRIFLAGS (not a cargo -Z arg, which cargo rejects): the
        # workflow-yaml tests write/read temp files, which Miri's default
        # isolation forbids ("unsupported operation: `open` not available").
        # PROPTEST_CASES: the state-machine proptests run ~256 cases each,
        # 2.5-4 min under Miri interpretation — the suite blows the job
        # timeout. UB checking needs code-path coverage, not statistical
        # power; 25 cases keep every transition path exercised.
        env:
          MIRIFLAGS: -Zmiri-disable-isolation
          PROPTEST_CASES: 25
        run: cargo +nightly miri test -p agentgrid-common

  two-host:
    name: physical two-host E2E (local CP + remote node)
    runs-on: ubuntu-latest
    # Hardening P2 item 28: the same workflow manifest runs with roles spread
    # across two physical hosts (remote box reached via tests/e2e/remote-ssh.py
    # with AG_REMOTE_* secrets). exit 77 = "no remote configured" → treated as
    # skip so CI without a spare box stays green; nightly + manual.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: [rust]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae
      - name: build debug binaries
        run: cargo build --workspace
      - name: two-host workflow E2E
        env:
          AG_REMOTE_HOST: ${{ secrets.AG_REMOTE_HOST }}
          AG_REMOTE_USER: ${{ secrets.AG_REMOTE_USER }}
          AG_REMOTE_PASS: ${{ secrets.AG_REMOTE_PASS }}
          # Key auth preferred (run-two-host.sh uses AG_REMOTE_KEY when set);
          # the password path is the legacy fallback in tests/e2e/remote-ssh.py.
          AG_REMOTE_PORT: ${{ secrets.AG_REMOTE_PORT }}
          AG_REMOTE_SSH_KEY: ${{ secrets.AG_REMOTE_SSH_KEY }}
        run: |
          if [ -z "$AG_REMOTE_HOST" ] || [ -z "$AG_REMOTE_USER" ] || [ -z "$AG_REMOTE_PASS" ]; then
            echo "no AG_REMOTE_* configured — skipping two-host job"
            exit 0
          fi
          # The script reads AG_REMOTE_* from .env; point it at the CI env.
          cat > .env <<EOF
          AG_REMOTE_HOST=$AG_REMOTE_HOST
          AG_REMOTE_USER=$AG_REMOTE_USER
          AG_REMOTE_PASS=$AG_REMOTE_PASS
          AG_REMOTE_PORT=${AG_REMOTE_PORT:-22}
          EOF
          # Key auth for the remote box arrives as the raw private key in the
          # AG_REMOTE_SSH_KEY secret; install it at the default path the
          # script (and remote-ssh.py) look up.
          if [ -n "$AG_REMOTE_SSH_KEY" ]; then
            mkdir -p "$HOME/.ssh" && chmod 700 "$HOME/.ssh"
            printf '%s\n' "$AG_REMOTE_SSH_KEY" > "$HOME/.ssh/id_ed25519_agentgrid_remote"
            chmod 600 "$HOME/.ssh/id_ed25519_agentgrid_remote"
          fi
          bash tests/e2e/run-two-host.sh

  real-agent:
    name: real-agent E2E (API key, two nodes)
    runs-on: ubuntu-latest
    # Plan 1.5: one real task across two nodes behind an API key. The script
    # exits 77 when AG_REAL_KEY (or the agent CLI) is missing → treated as a
    # skip so CI without keys stays green. The adapter-contract side of this
    # gate is the `#[ignore]`d tests in crates/adapters. Nightly + manual.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: [rust]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae
      - name: build debug binaries
        run: cargo build --workspace
      - name: install the real agent CLIs
        run: |
          npm install -g @anthropic-ai/claude-code opencode-ai
      - name: opencode custom-provider config (agentrouter)
        # codex-like config layout: the script passes OPENCODE_CONFIG via
        # AG_REAL_EXTRA_ENV; the key stays a secret referenced by name.
        run: |
          mkdir -p "$HOME/.config/opencode-e2e"
          cat > "$HOME/.config/opencode-e2e/opencode.json" <<'EOF'
          {
            "$schema": "https://opencode.ai/config.json",
            "model": "ar/deepseek-v4-flash",
            "permission": { "edit": "allow", "write": "allow", "bash": "allow", "webfetch": "allow" },
            "provider": {
              "ar": {
                "npm": "@ai-sdk/openai-compatible",
                "name": "agentrouter",
                "options": { "baseURL": "https://agentrouter.org/v1", "apiKey": "{env:AR_KEY}" },
                "models": { "deepseek-v4-flash": { "name": "deepseek-v4-flash" } }
              }
            }
          }
          EOF
      - name: run one real task on two nodes
        env:
          AG_REAL_KEY: ${{ secrets.AG_REAL_KEY }}
          # Optional adapter override + extra node env (e.g. an Anthropic-
          # compatible gateway endpoint + model); defaults = plain claude key.
          AG_REAL_ADAPTER: ${{ secrets.AG_REAL_ADAPTER }}
          AG_REAL_EXTRA_ENV: ${{ secrets.AG_REAL_EXTRA_ENV }}
          # Forwarded to run-real-agent.sh when AG_REAL_ADAPTER=opencode so
          # the provider key lands in the right env var name.
          AG_REAL_KEY_NAME: ${{ secrets.AG_REAL_KEY_NAME }}
          # Keep the sandbox so the upload step below can attach node/attempt
          # outputs to a failed run.
          AG_E2E_KEEP: "1"
        run: |
          rc=0
          bash tests/e2e/run-real-agent.sh || rc=$?
          if [ "$rc" = "77" ]; then
            echo "no AG_REAL_KEY configured — skipping real-agent job"
            exit 0
          fi
          exit "$rc"
      - name: upload real-agent debug logs on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: real-agent-e2e-logs
          path: /tmp/ag-e2e-real-*/
          if-no-files-found: ignore
