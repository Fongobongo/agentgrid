name: CI

on:
  push:
    branches: [master]
  pull_request:
  # Nightly gate: the same jobs re-run on a schedule so a flaky/new failure
  # surfaces even on a quiet master, matching the hardening plan's
  # "Nightly" release gates.
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: fmt / clippy / test / build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: format check
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: test
        run: cargo test --workspace
      - name: build
        run: cargo build --workspace

  web:
    name: web build / lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm run lint

  e2e-failinject:
    name: e2e failure injection (process, no Docker)
    runs-on: ubuntu-latest
    needs: [rust]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: build debug binaries
        run: cargo build --workspace
      - name: outbox durability (kill -9, CP outage, lost/retry)
        run: bash tests/e2e/run-outbox.sh
      - name: CP restart under load
        run: bash tests/e2e/run-cp-restart.sh
      - name: node disk-full fail-closed (spool limit)
        run: bash tests/e2e/run-disk-full.sh
        # Hardening P2 item 28: slow-network failure injection runs on every
        # build here (and via the schedule trigger above, nightly) since it is
        # process-based and quick.
      - name: slow-network failure injection
        run: bash tests/e2e/run-slow-net.sh

  e2e:
    name: e2e (compose + 2 nodes + mock)
    runs-on: ubuntu-latest
    needs: [rust, web]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: bring up stack and run a task
        run: bash tests/e2e/run.sh
        # Nightly-only (and manual): the workflow E2E brings up its own
        # compose stack and exercises a multi-role DAG across two nodes —
        # heavier than the per-PR smoke, so it runs only on schedule.
      - name: workflow E2E (multi-role DAG across two nodes)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: bash tests/e2e/run-workflow.sh

  skill-bundle:
    name: skill bundle materializes identically local vs remote
    runs-on: ubuntu-latest
    # Hardening P2 item 28: needs AG_REMOTE_* in repo secrets (.env is
    # gitignored). exit 77 = "no remote configured" → treated as skip so CI
    # without a spare box stays green; runs nightly + manually.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: materialize skill bundle on local + remote and compare hashes
        env:
          AG_REMOTE_HOST: ${{ secrets.AG_REMOTE_HOST }}
          AG_REMOTE_USER: ${{ secrets.AG_REMOTE_USER }}
          AG_REMOTE_PASS: ${{ secrets.AG_REMOTE_PASS }}
        run: |
          bash tests/e2e/run-skill-bundle.sh
          rc=$?
          if [ "$rc" = "77" ]; then
            echo "no AG_REMOTE_* configured — skipping skill-bundle job"
            exit 0
          fi
          exit "$rc"
