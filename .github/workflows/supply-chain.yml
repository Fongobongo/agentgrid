name: Supply chain

# Hardening P2 item 29: run `cargo audit` against the advisory database on
# every PR and push, and nightly, so a known-vulnerable dependency fails CI
# before it ships. Runs on the host target (no cross-compile needed).
on:
  push:
    branches: [master]
  pull_request:
  schedule:
    - cron: "0 6 * * *"

permissions:
  contents: read

jobs:
  cargo-audit:
    name: cargo audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  cargo-deny:
    name: cargo deny
    runs-on: ubuntu-latest
    # Hardening P2 item 29: enforce license + banned-crate + source policy on
    # top of the advisory check above.
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: install cargo-deny
        run: cargo install cargo-deny --locked
      - name: cargo deny check
        run: cargo deny check

  trivy-fs:
    name: trivy filesystem (IaC + secrets + misconfig)
    runs-on: ubuntu-latest
    # Hardening P2 item 29: scan the repo filesystem (config, IaC, secrets,
    # misconfig) with trivy — no image build needed. Catches leaked secrets /
    # policy-as-code issues that cargo-audit/deny (Rust-crate only) miss.
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: trivy fs scan
        uses: aquasecurity/trivy-action@0.24.0
        with:
          scan-type: fs
          scan-ref: .
          # Fail on HIGH/CRITICAL vulns + secrets; ignore unverifiable tool
          # updates so a flaky upstream GitHub API does not block the gate.
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
